  security:
    key_management:
      private_dc: "Kubernetes Secrets encrypted at rest for workloads; enterprise vault with HSM-backed keys for F5, WSO2, Kafka, HA data platforms, MFT platform, and network devices; automated rotation; no hardcoded credentials"
      azure: "Azure Key Vault with managed identities and private endpoints for Azure-owned secrets; third-party control evidence required"
      partner_keys: "CMP-11 obtains short-lived SSH certificates from the enterprise vault; dual control and automated rotation"
    user_auth_internal:
      server: "INF-09 | ADFS"
      protocol: "SAML 2.0 over TLS 1.3 with signed assertions and MFA"
    user_auth_external:
      server: "INF-10 | Enterprise ID"
      protocol: "OIDC / OAuth2.0 Authorization Code with PKCE and MFA"
    authorization:
      platform: "AuthZ Platform"
      enforcement: "CMP-04 API policy plus application-level RBAC, least privilege, deny by default"
    bastion:
      unified: "Privileged Access Workstation (PAW)"
      access_path: "Office Network -> MFA -> PAW -> approved management plane -> named private zone"
    operational_access:
      - "No public SSH, RDP, database, message-broker, or management endpoints"
      - "MFA, just-in-time elevation, named accounts, session recording, and dual approval for privileged access"
      - "Administrative traffic is isolated from application and data traffic"
      - "Quarterly access recertification and immediate revocation on role change"
    network_segmentation:
      ingress: "Internet traffic enters via INF-03 and terminates at INF-04; DMZ has no direct route to DB Zone"
      east_west: "Allowlisted flows only; cross-application APIs use CMP-04 and events use CMP-05"
      database: "DB Zone accepts encrypted connections only from CMP-06 through CMP-10 service identities"
      external: "3PL APIs use CMP-04; files use CMP-11; SAP RFC is Intranet-only; no partner has direct Intranet access"
      inter_dc: "Named private WAN paths use IPsec encryption; no direct cross-region database replication"
    data_protection:
      in_transit: "TLS 1.3 preferred and TLS 1.2 minimum; mTLS for trust-boundary APIs; SAP SNC for RFC; SSH-2 for SFTP"
      at_rest: "AES-256 for Confidential data in MySQL, Redis, RabbitMQ, Elasticsearch, Kafka, Azure services, backups, and managed-file staging"
      cross_border: "Minimize and classify CN-US API/event fields; encrypt in transit; retain in approved region; Privacy/Legal approval required before production"
      backups: "Encrypted, immutable backups with separate keys, restore testing, defined retention, and region-bound storage"
    monitoring:
      centralized: "F5, WSO2, Kafka, K8s, databases, MFT platform, identity, Azure, and network audit logs forward to the enterprise SIEM"
      controls: "Tamper-resistant retention, time synchronization, correlation IDs, DLP alerts, authentication anomaly detection, and 24x7 incident routing"
    resilience:
      application: "K8s anti-affinity, health checks, rolling deployment, disruption budgets, and capacity monitoring across HA workload groups"
      data: "Documented HA groups, encrypted backups, tested restore procedures, and no unsupported cross-border replication"
      integration: "WSO2, Kafka, F5, MFT platform, and edge routing run as monitored HA services with tested failover"
