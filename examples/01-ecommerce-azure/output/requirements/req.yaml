  open_items:
    - id: "TBD-01"
      description: "Decide whether SYS-21 Japan DC systems require a second dedicated circuit"
      owner: "TBD"
      blocking: false
    - id: "TBD-02"
      description: "Complete firewall rule-set and egress FQDN-tag review for SYS-11 AKS (BU), SYS-14 Common AKS, and SYS-17 AKS (AP)"
      owner: "TBD"
      blocking: false
    - id: "TBD-03"
      description: "Resolve stated SYS-02-to-SYS-03 peering against the prohibition on direct spoke-to-spoke firewall bypass"
      owner: "Network Architecture"
      blocking: true
    - id: "TBD-04"
      description: "Identify department, business owner, infrastructure owners, operational owners, and document author"
      owner: "Project Sponsor"
      blocking: false
    - id: "TBD-05"
      description: "Define application languages, frameworks, versions, runtimes, database engines, and storage SKU"
      owner: "Application Architecture"
      blocking: false
    - id: "TBD-06"
      description: "Define every application interface, initiator, provider, protocol, port, and authentication mechanism"
      owner: "Application and Security Architecture"
      blocking: true
    - id: "TBD-07"
      description: "Define customer authentication, internal administration entry point, identity protocols, roles, and authorization model"
      owner: "IAM"
      blocking: true
    - id: "TBD-08"
      description: "Define secret storage, managed identity use, key ownership, rotation, soft-delete, and purge protection"
      owner: "Security Architecture"
      blocking: true
    - id: "TBD-09"
      description: "Confirm encryption-at-rest methods and in-transit protocol versions, including hybrid circuit encryption"
      owner: "Security and Network Architecture"
      blocking: true
    - id: "TBD-10"
      description: "Define inter-region connectivity, replication, failover, RTO, RPO, availability targets, capacity, and scaling"
      owner: "Solution Architecture"
      blocking: false
    - id: "TBD-11"
      description: "Identify exact zones for SYS-20 US HQ DC systems and SYS-21 Japan DC systems"
      owner: "Infrastructure"
      blocking: false
    - id: "TBD-12"
      description: "Confirm data types, PII/payment-data handling, data flows, retention, backup, and applicable compliance obligations"
      owner: "Data and Compliance"
      blocking: true
    - id: "TBD-13"
      description: "Confirm that no credentials are hardcoded"
      owner: "Security Architecture"
      blocking: true
