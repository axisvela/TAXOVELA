name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install --quiet pyyaml pytest

      - name: Unit tests (workspace)
        run: python -m pytest tests -q

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install check dependencies
        run: pip install --quiet pyyaml

      - name: Distribution health check
        run: python scripts/check_repo.py

      - name: Verify Codex skill mirror is current
        run: python scripts/sync_agents_skills.py --check

      - name: Verify Claude plugin skills mirror is current
        run: python scripts/sync_plugin.py --check

      - name: Validate standards, schemas, and config YAML
        run: python tools/yaml_validate.py config.yaml standards/*.yaml schemas/*.json

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --quiet build

      - name: Clean-wheel smoke test
        run: python scripts/smoke_wheel.py
