  auth:
    - {id: "AUTH-01", subject: "user", applies_to: "CMP-01", auth_server: "INF-13", protocol: "SAML2", authorization: "RBAC", mfa: true, notes: "Federated to Cloud Identity; role mapping TBD"}
    - {id: "AUTH-02", subject: "user", applies_to: "CMP-01", auth_server: "INF-13", protocol: "OIDC", authorization: "RBAC", mfa: true, notes: "OAuth2.0 authorization code with PKCE; partner scopes TBD"}

  credentials:
    - {environment: "private_dc", solution: "Enterprise vault for ERP credentials; automated rotation"}
    - {environment: "other", solution: "Cloud KMS with CMEK for BigQuery and Cloud Storage; Secret Manager for runtime credentials"}

  constraints:
    - "A workload must not hold an external IP; all egress goes through Cloud NAT"
    - "BigQuery and Cloud Storage stay inside the VPC Service Controls perimeter"
    - "No static credentials in workloads; Secret Manager issues them at runtime"

  open_items:
