    - {from: "SYS-12", to: "SYS-17", protocol: "Kafka", auth: "SASL/SCRAM-SHA-512", encryption: "TLS 1.3"}
    - {from: "SYS-13", to: "SYS-17", protocol: "Kafka", auth: "SASL/SCRAM-SHA-512", encryption: "TLS 1.3"}

    # NA cross-application mediation is restricted to SYS-41 and SYS-42.
    - {from: "SYS-33", to: "SYS-41", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-34", to: "SYS-41", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-35", to: "SYS-41", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-36", to: "SYS-41", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-37", to: "SYS-41", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-38", to: "SYS-41", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-39", to: "SYS-41", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-40", to: "SYS-41", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
