  deployments:
    - {id: "DEP-01", component_id: "CMP-01", environment: "prod", deployment_type: "public_cloud", location_type: "public_cloud_region", infra_id: "INF-04", runtime_type: "container", runtime_detail: "GKE private cluster", instance_count: 2, status: "planned"}
