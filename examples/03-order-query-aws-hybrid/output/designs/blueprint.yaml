_design:
  stage: "design"
  project_id: "OQP-ROW-001"
  requirements_source: "output/requirements/req.yaml"
  registry_source: "input/systems-registry.md"
  templates: ["aws-hybrid", "private-cloud", "data-analytics"]
  decisions:
    - decision: "AWS ingress and tier boundaries"
      choice: "INF-05 WAF ingress, INF-06 DMZ firewall, and INF-07 App firewall"
      rationale: "Appliance policy models WAF and firewalls as infra L4 nodes; they are explicit hops in the relevant component flows."
    - decision: "Identity and runtime classification"
      choice: "INF-12 and INF-13 are identity-provider infra; Internal K8s Platform is deployment runtime detail"
      rationale: "Identity providers are appliances and the Kubernetes platform is a runtime substrate, not a component or topology appliance."
    - decision: "Cross-system integration and residency"
      choice: "CMP-25 through CMP-32 provide the API and Kafka mediation boundaries"
      rationale: "The architecture prohibits direct source-to-application calls and keeps PRC row processing in-country."
  validation_focus:
    - "Verify every public and cross-zone route traverses its declared INF appliance hop."
    - "Verify PRC requests remain mediated and no row payload crosses LNK-03 or LNK-04."
    - "Confirm unresolved ports, source mappings, and data-service settings before implementation."

arch:
  id: "OQP-ROW-001-TechDiagram-V2.0"
  name: "Order Query Platform - AWS Hybrid Technical Architecture"
  platform: "hybrid_cloud"
  version: "V2.0"
  author: "OpenCode"
  owner_team: "TBD"
  last_modified: "2026-09-24"

  deployment:
    - id: "INF-01"
      type: "aws_vpc"
      role: "production"
      location: "AWS US, N. Virginia [US]"
      owner: "TBD"
      subnets:
        - id: "INF-02"
          type: "public"
          name: "Public subnet (DMZ)"
          components:
            - {id: "INF-05", name: "INF-05 AWS WAF and ALB", type: "SEC", shape: "hexagon", owner_type: "org_it", status: "newly_created", notes: "Public HTTPS ingress"}
            - {id: "INF-06", name: "INF-06 AWS DMZ boundary firewall", type: "SEC", shape: "hexagon", owner_type: "org_it", status: "newly_created", notes: "DMZ to application boundary"}
            - {id: "CMP-01", name: "CMP-01 order-web", type: "FE", runtime: "Internal K8s Platform frontend cluster", owner_type: "org_it", status: "newly_created"}
        - id: "INF-03"
          type: "private"
          name: "Private subnet (App Zone)"
          components:
            - {id: "INF-07", name: "INF-07 AWS App boundary firewall", type: "SEC", shape: "hexagon", owner_type: "org_it", status: "newly_created", notes: "Application to data and WAN boundary"}
            - {id: "CMP-02", name: "CMP-02 gateway", type: "API", shape: "parallelogram", runtime: "Internal K8s Platform backend cluster", owner_type: "org_it", status: "newly_created"}
            - {id: "CMP-03", name: "CMP-03 order-portal", type: "BE", runtime: "Internal K8s Platform backend cluster", owner_type: "org_it", status: "newly_created"}
            - {id: "CMP-04", name: "CMP-04 order-report", type: "BE", runtime: "Internal K8s Platform backend cluster", owner_type: "org_it", status: "newly_created"}
            - {id: "CMP-11", name: "CMP-11 prc-consumer", type: "BE", runtime: "Internal K8s Platform backend cluster", owner_type: "org_it", status: "newly_created", notes: "Approved request messages only"}
        - id: "INF-04"
          type: "private"
          name: "Private subnet (DB Zone)"
          components:
            - {id: "INF-08", name: "INF-08 AWS KMS", type: "SEC", shape: "hexagon", owner_type: "org_it", status: "newly_created"}
            - {id: "CMP-21", name: "CMP-21 ods-db", type: "DB", shape: "cylinder", owner_type: "org_it", status: "newly_created"}
            - {id: "CMP-22", name: "CMP-22 dws-db", type: "DB", shape: "cylinder", owner_type: "org_it", status: "newly_created"}
            - {id: "CMP-23", name: "CMP-23 cache", type: "DB", shape: "cylinder", owner_type: "org_it", status: "newly_created"}
            - {id: "CMP-24", name: "CMP-24 object-store", type: "DS", owner_type: "org_it", status: "newly_created"}

    - id: "INF-09"
      type: "private_dc"
      role: "production"
      location: "US DC [US]"
      owner: "IT Org"
      network_zones:
        - id: "INF-10"
          type: "dmz"
          name: "US DMZ"
          components:
            - {id: "INF-11", name: "INF-11 US boundary firewall", type: "SEC", shape: "hexagon", owner_type: "org_it", status: "unchanged"}
            - {id: "CMP-25", name: "CMP-25 dmz-apim", type: "IP", shape: "parallelogram", owner_type: "org_it", status: "unchanged"}
            - {id: "CMP-54", name: "CMP-54 internal-portal", type: "FE", owner_type: "org_it", status: "unchanged"}
            - {id: "CMP-55", name: "CMP-55 partner-portal", type: "FE", owner_type: "org_it", status: "unchanged"}
        - id: "us-app"
          type: "app_zone"
          name: "US application and identity zone"
          components:
            - {id: "INF-12", name: "INF-12 ADFS", type: "SEC", shape: "circle", owner_type: "org_it", status: "unchanged"}
            - {id: "INF-13", name: "INF-13 Enterprise ID", type: "SEC", shape: "circle", owner_type: "third_party", status: "unchanged"}
            - {id: "CMP-26", name: "CMP-26 us-apim", type: "IP", shape: "parallelogram", owner_type: "org_it", status: "unchanged"}
            - {id: "CMP-28", name: "CMP-28 us-kafka", type: "MQ", shape: "message_queue", owner_type: "org_it", status: "unchanged"}

    - id: "INF-14"
      type: "private_dc"
      role: "production"
      location: "NA DC [US]"
      owner: "IT Org"
      network_zones:
        - id: "INF-15"
          type: "app_zone"
          name: "NA integration zone"
          components:
            - {id: "INF-18", name: "INF-18 NA boundary firewall", type: "SEC", shape: "hexagon", owner_type: "org_it", status: "unchanged"}
            - {id: "CMP-27", name: "CMP-27 na-apih", type: "IP", shape: "parallelogram", owner_type: "org_it", status: "unchanged"}
            - {id: "CMP-31", name: "CMP-31 na-kafka", type: "MQ", shape: "message_queue", owner_type: "org_it", status: "unchanged"}
            - {id: "CMP-32", name: "CMP-32 na-log-kafka", type: "MQ", shape: "message_queue", owner_type: "org_it", status: "unchanged"}

    - id: "INF-19"
      type: "private_dc"
      role: "production"
      location: "PRC primary DC [CN]"
      owner: "IT Org"
      network_zones:
        - id: "INF-21"
          type: "intranet"
          name: "PRC primary intranet"
          components:
            - {id: "INF-22", name: "INF-22 PRC primary boundary firewall", type: "SEC", shape: "hexagon", owner_type: "org_it", status: "unchanged"}
            - {id: "CMP-29", name: "CMP-29 cn-primary-kafka", type: "MQ", shape: "message_queue", owner_type: "org_it", status: "unchanged"}
            - {id: "CMP-44", name: "CMP-44 gap-cn", type: "IP", shape: "parallelogram", owner_type: "org_it", status: "unchanged"}

    - id: "INF-23"
      type: "private_dc"
      role: "production"
      location: "PRC secondary DC [CN]"
      owner: "IT Org"
      network_zones:
        - id: "INF-25"
          type: "intranet"
          name: "PRC secondary intranet"
          components:
            - {id: "INF-26", name: "INF-26 PRC secondary boundary firewall", type: "SEC", shape: "hexagon", owner_type: "org_it", status: "unchanged"}
            - {id: "CMP-30", name: "CMP-30 cn-secondary-kafka", type: "MQ", shape: "message_queue", owner_type: "org_it", status: "unchanged"}

    - id: "INF-28"
      type: "azure_vnet"
      role: "production"
      location: "Azure CN North [CN]"
      owner: "Data Org"
      subnets:
        - id: "azure-cn-edw"
          type: "spoke"
          name: "PRC EDW"
          components:
            - {id: "CMP-53", name: "CMP-53 prc-dwp", type: "IP", shape: "parallelogram", owner_type: "biz_owned", status: "unchanged", notes: "In-country query boundary"}

  interactions:
    - {from: "internet", to: "INF-05", protocol: "HTTPS; 443", auth: "none", encryption: "TLS 1.2+", notes: "Public browser ingress"}
    - {from: "INF-05", to: "CMP-01", protocol: "HTTPS; 443", auth: "SAML2", encryption: "TLS 1.2+", notes: "AUTH-01 or AUTH-02 user entry"}
    - {from: "CMP-01", to: "INF-06", protocol: "HTTPS; 443", auth: "OAuth2_ClientCredentials", encryption: "TLS 1.2+", notes: "DMZ boundary"}
    - {from: "INF-06", to: "CMP-02", protocol: "HTTPS; 443", auth: "OAuth2_ClientCredentials", encryption: "TLS 1.2+", notes: "Allow-listed gateway route"}
    - {from: "CMP-02", to: "CMP-03", protocol: "HTTPS; 443", auth: "OAuth2_ClientCredentials", encryption: "TLS 1.2+", notes: "Application service"}
    - {from: "CMP-03", to: "INF-07", protocol: "PostgreSQL; 5432", auth: "UserPassword", encryption: "TLS 1.2+", notes: "Data boundary"}
    - {from: "INF-07", to: "CMP-21", protocol: "PostgreSQL; 5432", auth: "UserPassword", encryption: "TLS 1.2+", notes: "ODS access"}
    - {from: "CMP-04", to: "CMP-22", protocol: "PostgreSQL; 5432", auth: "UserPassword", encryption: "TLS 1.2+", notes: "DWS reporting"}
    - {from: "CMP-03", to: "CMP-23", protocol: "Redis; 6379", auth: "UserPassword", encryption: "TLS 1.2+", notes: "Cache access"}
    - {from: "CMP-04", to: "CMP-24", protocol: "HTTPS; 443", auth: "IAM_Role", encryption: "TLS 1.2+", notes: "Object storage"}
    - {from: "CMP-02", to: "CMP-26", protocol: "HTTPS; 443", auth: "OAuth2_ClientCredentials", encryption: "TLS 1.2+", notes: "Mandatory US mediation"}
    - {from: "CMP-02", to: "CMP-27", protocol: "HTTPS; 443", auth: "OAuth2_ClientCredentials", encryption: "TLS 1.2+", notes: "Mandatory NA mediation"}
    - {from: "CMP-11", to: "CMP-30", protocol: "Kafka; 9093", auth: "SASL_SCRAM", encryption: "TLS 1.2+", notes: "Approved request messages only"}
    - {from: "CMP-30", to: "CMP-53", protocol: "HTTPS; 443", auth: "OAuth2_ClientCredentials", encryption: "TLS 1.2+", notes: "In-country PRC query"}
    - {from: "internet", to: "CMP-25", protocol: "HTTPS; 443", auth: "OAuth2_ClientCredentials", encryption: "TLS 1.2+", notes: "External source mediation"}
    - {from: "INF-12", to: "CMP-54", protocol: "HTTPS/SAML2; 443", auth: "SAML2", encryption: "TLS 1.2+", notes: "Internal portal SSO"}
    - {from: "INF-13", to: "CMP-55", protocol: "HTTPS/SAML2; 443", auth: "SAML2", encryption: "TLS 1.2+", notes: "Partner portal SSO"}
    - {from: "INF-09", to: "INF-01", protocol: "MPLS", auth: "OAuth2_ClientCredentials", encryption: "TLS 1.2+", notes: "LNK-01"}
    - {from: "INF-14", to: "INF-01", protocol: "MPLS", auth: "OAuth2_ClientCredentials", encryption: "TLS 1.2+", notes: "LNK-02"}
    - {from: "INF-19", to: "INF-01", protocol: "MPLS", auth: "SASL_SCRAM", encryption: "TLS 1.2+", notes: "LNK-03; PRC rows prohibited"}
    - {from: "INF-23", to: "INF-01", protocol: "MPLS", auth: "SASL_SCRAM", encryption: "TLS 1.2+", notes: "LNK-04; PRC rows prohibited"}

  security:
    key_management:
      aws: "INF-08 AWS KMS with AWS Secrets Manager; rotation period TBD; hardcoded credentials prohibited"
      private_dc: "Enterprise secret-management platform and rotation ownership TBD"
    user_auth_internal: {server: "INF-12", protocol: "SAML2 over TLS 1.2+"}
    user_auth_external: {server: "INF-13", protocol: "SAML2 over TLS 1.2+"}
    authorization: {platform: "AuthZ Platform; role model TBD", enforcement: "CMP-02 and mediated service boundaries"}
    operational_access: ["No public SSH or RDP", "MFA required for privileged access", "Least privilege and logged administration"]
    data_protection:
      in_transit: "TLS 1.2+ on every application hop; Kafka uses TLS with SASL/SCRAM"
      at_rest: "Encryption required for CMP-21 through CMP-24 and CMP-28 through CMP-32; settings TBD"
      cross_border: "PRC-sourced rows remain in China; cross-border links carry only approved requests, control data, or non-row responses"
