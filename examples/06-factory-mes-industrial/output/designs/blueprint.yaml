_design:
  template: "private-cloud with Azure endpoint extension"
  decisions:
    - choice: "Plant-local K8s services and PostgreSQL HA remain independent of WAN services"
      rationale: "Manufacturing execution must continue during central DC, identity, or WAN outages."
    - choice: "CMP-16 uses a durable PostgreSQL outbox and replays to central Kafka after WAN recovery"
      rationale: "This provides asynchronous store-and-forward without adding an unregistered plant system."
    - choice: "CMP-26 is deployed once in dc-cn-primary"
      rationale: "The systems registry is authoritative for the stable system location; the conflicting NA placement remains an implementation check."
    - choice: "All Kafka client connections use SASL/SCRAM-SHA-512 plus mTLS"
      rationale: "Mutual transport identity, per-client credentials, and topic ACLs provide least-privilege event access."
    - choice: "All service APIs use OAuth 2.0 client credentials plus mTLS"
      rationale: "Workload identity and encrypted service-to-service communication are explicit at every boundary."
  open_implementation_checks:
    - "Confirm versions for Java, Spring, Nginx, PostgreSQL, and Spring Cloud Gateway before implementation approval."
    - "Confirm WAN carrier products, Kafka topic names, retention periods, retry limits, and replay runbooks."
    - "Confirm the CMP-26 location resolution with the application owner before detailed deployment."
    - "Complete the event field inventory and US/CN cross-border legal approval before production."

