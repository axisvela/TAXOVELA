_template:
  id: "private-cloud"
  version: "2.0"
  mixed_with: "azure satellite boundary"

# TODO TBD-001: Confirm the NA cut-over sequence for CMP-10.
# TODO TBD-004: Security must approve the selected mTLS device authentication for INF-04 to CMP-01.
# TODO TBD-005: Partner owners must confirm HTTPS/mTLS for CMP-40 through CMP-45 or document an approved EDI alternative.
# TODO TBD-006: SAP owner must confirm hosting, SNC-protected RFC endpoints, and SAP authentication.
# TODO TBD-007: Cloud owner must confirm the Azure US region, subnet ownership, and private connectivity roadmap.
# TODO TBD-008: InfraSec must confirm IPsec encryption over each named private WAN path.
# TODO TBD-009: InfraSec must select the enterprise vault and rotation controls for non-K8s secrets.
# TODO TBD-010: Data owners must confirm AES-256 at-rest implementation for all HA data platforms and managed files.
# TODO TBD-011: Privacy/Legal must approve the minimized CN-US transfer dataset and transfer basis.
# TODO TBD-013: Integration owner must complete migration from Basic Auth to OAuth2 client credentials or obtain risk acceptance.
arch:
  id: "SDP-NA-001-TechDiagram-V1.0"
  name: "Service Delivery Platform (SDP) - Private Cloud Multi-DC Technical Architecture"
  platform: "hybrid_cloud"
  version: "V1.0"
  author: "ArchHarness"
  owner_team: "Service Delivery Platform Team"
  last_modified: "2026-09-14"

  deployment:
    - id: "dc-cn-primary"
      type: "private_dc"
      role: "production"
      location: "CN Primary DC, City A, Province A [CN]"
      owner: "InfraSec"
      network_zones:
        - id: "dc-cn-primary-dmz"
          type: "dmz"
          name: "DMZ"
          components:
            - id: "INF-03"
              name: "INF-03 | Edge router"
              type: "NW"
              runtime: "Private DC network platform"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "Named Internet edge; no IP or CIDR assigned"
            - id: "INF-04"
              name: "INF-04 | F5"
              type: "LB"
              shape: "hexagon"
              runtime: "Private DC appliance"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "HA ingress and TLS termination group"
            - id: "CMP-01"
              name: "CMP-01 | Service-Supply-Chain-dmz-nginx-proxy"
              type: "FE"
              language: "N/A"
              framework: "Nginx (version TBD)"
              runtime: "Internal K8s Platform"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "HA DMZ reverse-proxy workload"
            - id: "CMP-02"
              name: "CMP-02 | Service-Supply-Chain-gateway"
              type: "API"
              language: "Java (version TBD)"
              framework: "Spring Cloud (version TBD)"
              runtime: "Internal K8s Platform"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "HA DMZ API gateway workload"
            - id: "CMP-03"
              name: "CMP-03 | Service-Supply-Chain-web"
              type: "FE"
              language: "Java (version TBD)"
              framework: "Spring Cloud (version TBD)"
              runtime: "Internal K8s Platform"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "HA web frontend workload"

        - id: "dc-cn-primary-intranet"
          type: "intranet"
          name: "Intranet"
          components:
            - id: "CMP-04"
              name: "CMP-04 | WSO2"
              type: "IP"
              shape: "parallelogram"
              framework: "WSO2 API Gateway (version TBD)"
              runtime: "Private DC integration platform"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "HA API mediation; all cross-application APIs traverse this component"
            - id: "CMP-05"
              name: "CMP-05 | Kafka (primary)"
              type: "MQ"
              shape: "message_queue"
              framework: "Kafka (version TBD)"
              runtime: "Private DC HA cluster"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "Primary event bus; all cross-application events traverse this component"
            - id: "CMP-06"
              name: "CMP-06 | Service-Supply-Chain-int-nginx-proxy"
              type: "BE"
              language: "N/A"
              framework: "Nginx (version TBD)"
              runtime: "Internal K8s Platform"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
            - id: "CMP-07"
              name: "CMP-07 | Service-Supply-Chain-main"
              type: "BE"
              language: "Java (version TBD)"
              framework: "Spring Cloud (version TBD)"
              runtime: "Internal K8s Platform"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
            - id: "CMP-08"
              name: "CMP-08 | Service-Supply-Chain-websocket"
              type: "BE"
              language: "Java (version TBD)"
              framework: "Spring Cloud (version TBD)"
              runtime: "Internal K8s Platform"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
            - id: "CMP-09"
              name: "CMP-09 | Service-Supply-Chain-* group (10 services)"
              type: "BE"
              language: "Java (version TBD)"
              framework: "Spring Cloud (version TBD)"
              runtime: "Internal K8s Platform HA workload group"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "rms, tms, oms, wms, mds, ips, autopilot, ves, cfs, scs"
            - id: "CMP-10"
              name: "CMP-10 | Service-Supply-Chain-* group (22 services)"
              type: "BE"
              language: "Java (version TBD)"
              framework: "Spring Cloud (version TBD)"
              runtime: "Internal K8s Platform HA workload group"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "Registry label retained; supplied member list has 21 names pending reconciliation"
            - id: "CMP-11"
              name: "CMP-11 | MFT platform"
              type: "IP"
              shape: "parallelogram"
              framework: "MFT platform (version TBD)"
              runtime: "Private DC HA integration platform"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "Only managed file-transfer egress to CMP-46 through CMP-48"

        - id: "dc-cn-primary-db"
          type: "db_zone"
          name: "DB Zone"
          components:
            - id: "CMP-12"
              name: "CMP-12 | MySQL TMS HA (1 primary + 2 replicas)"
              type: "DB"
              shape: "cylinder"
              framework: "MySQL (version TBD)"
              runtime: "Private DC HA group"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "AES-256 at rest; no cross-region database replication"
            - id: "CMP-13"
              name: "CMP-13 | MySQL Main HA (1 primary + 2 replicas)"
              type: "DB"
              shape: "cylinder"
              framework: "MySQL (version TBD)"
              runtime: "Private DC HA group"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "AES-256 at rest; no cross-region database replication"
            - id: "CMP-14"
              name: "CMP-14 | MySQL WMS HA (1 primary + 2 replicas)"
              type: "DB"
              shape: "cylinder"
              framework: "MySQL (version TBD)"
              runtime: "Private DC HA group"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "AES-256 at rest; no cross-region database replication"
            - id: "CMP-15"
              name: "CMP-15 | MySQL MDS HA (1 primary + 2 replicas)"
              type: "DB"
              shape: "cylinder"
              framework: "MySQL (version TBD)"
              runtime: "Private DC HA group"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "AES-256 at rest; no cross-region database replication"
            - id: "CMP-16"
              name: "CMP-16 | MySQL OMS HA (1 primary + 2 replicas)"
              type: "DB"
              shape: "cylinder"
              framework: "MySQL (version TBD)"
              runtime: "Private DC HA group"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "AES-256 at rest; no cross-region database replication"
            - id: "CMP-17"
              name: "CMP-17 | Redis HA (3 primary + 3 replicas)"
              type: "DB"
              shape: "cylinder"
              framework: "Redis (version TBD)"
              runtime: "Private DC HA group"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "TLS and ACL authentication; AES-256 at rest"
            - id: "CMP-18"
              name: "CMP-18 | RabbitMQ HA (3 replicas)"
              type: "MQ"
              shape: "message_queue"
              framework: "RabbitMQ (version TBD)"
              runtime: "Private DC HA group"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "TLS and SCRAM authentication; AES-256 at rest"
            - id: "CMP-19"
              name: "CMP-19 | Elasticsearch HA (3 nodes)"
              type: "DB"
              shape: "cylinder"
              framework: "Elasticsearch (version TBD)"
              runtime: "Private DC HA group"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "changed"
              notes: "TLS and service authentication; AES-256 at rest"

    - id: "dc-us"
      type: "private_dc"
      role: "production"
      location: "US DC, City C, State X [US]"
      owner: "InfraSec"
      network_zones:
        - id: "dc-us-intranet"
          type: "intranet"
          name: "App Zone / Intranet"
          components:
            - {id: "CMP-20", name: "CMP-20 | Account-Service", type: "BE", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "Existing black-box API boundary"}
            - {id: "CMP-21", name: "CMP-21 | Service-customer-master-data", type: "BE", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "Existing black-box API boundary"}
            - {id: "CMP-22", name: "CMP-22 | Serice-Data-serviceE", type: "BE", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "Registry-resolved label retained"}
            - {id: "CMP-23", name: "CMP-23 | Price-master-ROW", type: "BE", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "Existing black-box API boundary"}
            - {id: "INF-09", name: "INF-09 | ADFS", type: "SEC", shape: "circle", sensitivity: "Acme Confidential", owner_type: "org_it", status: "unchanged", notes: "Internal SAML identity provider"}
            - {id: "INF-10", name: "INF-10 | Enterprise ID", type: "SEC", shape: "circle", sensitivity: "Acme Confidential", owner_type: "org_it", status: "unchanged", notes: "External OIDC identity provider"}

    - id: "dc-cn-secondary"
      type: "private_dc"
      role: "production"
      location: "CN Secondary DC, City B, Province B [CN]"
      owner: "InfraSec"
      network_zones:
        - id: "dc-cn-secondary-intranet"
          type: "intranet"
          name: "Intranet"
          components:
            - {id: "CMP-24", name: "CMP-24 | Reverse-Management-System", type: "BE", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "Existing black-box API boundary"}
            - {id: "CMP-25", name: "CMP-25 | procurement-service", type: "BE", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "Existing black-box API boundary"}
            - {id: "CMP-26", name: "CMP-26 | lakehouse", type: "DS", shape: "stored_data", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "Existing black-box data API boundary"}
            - {id: "CMP-27", name: "CMP-27 | Kafka (secondary)", type: "MQ", shape: "message_queue", sensitivity: "Acme Confidential", owner_type: "org_it", status: "unchanged", notes: "Secondary event cluster"}
            - {id: "CMP-28", name: "CMP-28 | support-hub", type: "BE", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "Existing black-box API boundary"}

    - id: "dc-cn-support"
      type: "private_dc"
      role: "production"
      location: "Support DC, City F [CN]"
      owner: "InfraSec"
      network_zones:
        - id: "dc-cn-support-app"
          type: "app_zone"
          name: "App Zone"
          components:
            - {id: "CMP-29", name: "CMP-29 | support-portal", type: "BE", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "Existing black-box API boundary"}
            - {id: "CMP-30", name: "CMP-30 | support-gateway", type: "API", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "Existing black-box API boundary"}

    - id: "sap-landscape"
      type: "private_dc"
      role: "production"
      location: "SAP landscape [location TBD]"
      owner: "SAP Team (TBD)"
      network_zones:
        - id: "sap-private-zone"
          type: "intranet"
          name: "SAP Private Zone"
          components:
            - {id: "CMP-31", name: "CMP-31 | S4", type: "BE", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "SAP ERP hub; no DMZ exposure"}
            - {id: "CMP-32", name: "CMP-32 | SECC", type: "BE", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "SAP black-box boundary"}
            - {id: "CMP-33", name: "CMP-33 | LSCRM", type: "BE", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "SAP black-box boundary"}
            - {id: "CMP-34", name: "CMP-34 | CECC", type: "BE", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "SAP black-box boundary"}
            - {id: "CMP-35", name: "CMP-35 | S3", type: "DS", shape: "stored_data", sensitivity: "Acme Confidential", owner_type: "biz_owned", status: "unchanged", notes: "SAP object-storage boundary"}

    - id: "azure-us-satellites"
      type: "azure_vnet"
      role: "production"
      location: "Azure US [exact region TBD]"
      owner: "ThirdParty / Cloud Owner (TBD)"
      subnets:
        - id: "azure-us-saas"
          type: "spoke"
          name: "SaaS Application Boundary"
          components:
            - {id: "CMP-36", name: "CMP-36 | d365-service-delivery-bu1", type: "BE", shape: "cloud_rect", sensitivity: "Acme Confidential", owner_type: "third_party", status: "unchanged", notes: "Existing SaaS black-box API boundary"}
            - {id: "CMP-37", name: "CMP-37 | d365-service-delivery-bu2", type: "BE", shape: "cloud_rect", sensitivity: "Acme Confidential", owner_type: "third_party", status: "unchanged", notes: "Existing SaaS black-box API boundary"}
            - {id: "CMP-38", name: "CMP-38 | d365-service-delivery-bu3", type: "BE", shape: "cloud_rect", sensitivity: "Acme Confidential", owner_type: "third_party", status: "unchanged", notes: "Existing SaaS black-box API boundary"}
        - id: "azure-us-app"
          type: "spoke"
          name: "Application Boundary"
          components:
            - {id: "CMP-39", name: "CMP-39 | edge-cache", type: "BE", sensitivity: "Acme Confidential", owner_type: "third_party", status: "unchanged", notes: "Existing event-consuming black-box boundary"}

    - id: "external-3pl"
      type: "private_dc"
      role: "production"
      location: "Partner hosted [locations TBD]"
      owner: "ThirdParty"
      network_zones:
        - id: "external-3pl-boundary"
          type: "dmz"
          name: "Internet 3PL Boundary"
          components:
            - {id: "CMP-40", name: "CMP-40 | logistics partner A", type: "BE", shape: "cloud_rect", owner_type: "third_party", status: "unchanged", notes: "External logistics partner"}
            - {id: "CMP-41", name: "CMP-41 | logstics-vendor-1", type: "BE", shape: "cloud_rect", owner_type: "third_party", status: "unchanged", notes: "External logistics partner; registry spelling retained"}
            - {id: "CMP-42", name: "CMP-42 | logistics partner B", type: "BE", shape: "cloud_rect", owner_type: "third_party", status: "unchanged", notes: "External logistics partner"}
            - {id: "CMP-43", name: "CMP-43 | logistics partner C", type: "BE", shape: "cloud_rect", owner_type: "third_party", status: "unchanged", notes: "External logistics partner"}
            - {id: "CMP-44", name: "CMP-44 | logistics partner D", type: "BE", shape: "cloud_rect", owner_type: "third_party", status: "unchanged", notes: "External logistics partner"}
            - {id: "CMP-45", name: "CMP-45 | logistics partner E", type: "BE", shape: "cloud_rect", owner_type: "third_party", status: "unchanged", notes: "External logistics partner"}

    - id: "external-file-partners"
      type: "private_dc"
      role: "production"
      location: "Partner hosted [locations TBD]"
      owner: "ThirdParty"
      network_zones:
        - id: "external-file-boundary"
          type: "dmz"
          name: "Internet File-Transfer Boundary"
          components:
            - {id: "CMP-46", name: "CMP-46 | file partner A", type: "BE", shape: "cloud_rect", owner_type: "third_party", status: "unchanged", notes: "External managed-file partner"}
            - {id: "CMP-47", name: "CMP-47 | file partner B", type: "BE", shape: "cloud_rect", owner_type: "third_party", status: "unchanged", notes: "External managed-file partner"}
            - {id: "CMP-48", name: "CMP-48 | file partner C", type: "BE", shape: "cloud_rect", owner_type: "third_party", status: "unchanged", notes: "External managed-file partner"}

  interactions:
    - {from: "internet", to: "INF-03", protocol: "HTTPS/TLS 1.3", auth: "OAuth2.0 Authorization Code", encryption: "TLS 1.3", notes: "External clients and 3PL traffic enter the named edge"}
    - {from: "INF-03", to: "INF-04", protocol: "HTTPS/TLS 1.3", auth: "mTLS", encryption: "TLS 1.3", notes: "Routed ingress to F5 HA group"}
    - {from: "INF-04", to: "CMP-01", protocol: "HTTPS/TLS 1.3", auth: "mTLS", encryption: "TLS 1.3", notes: "Selected secure default pending TBD-004 approval"}
    - {from: "CMP-01", to: "CMP-03", protocol: "HTTPS/TLS 1.3", auth: "mTLS", encryption: "TLS 1.3", notes: "DMZ reverse proxy to web tier"}
    - {from: "CMP-03", to: "CMP-02", protocol: "HTTPS/TLS 1.3", auth: "OAuth2.0 User Token", encryption: "TLS 1.3", notes: "Web API call"}
    - {from: "CMP-02", to: "CMP-04", protocol: "HTTPS/TLS 1.3", auth: "OAuth2.0 Client Credentials + mTLS", encryption: "TLS 1.3", notes: "Basic Auth replacement target"}
    - {from: "CMP-04", to: "CMP-09", protocol: "HTTPS/TLS 1.3", auth: "OAuth2.0 Client Credentials", encryption: "TLS 1.3", notes: "Mediated API route"}
    - {from: "CMP-04", to: "CMP-10", protocol: "HTTPS/TLS 1.3", auth: "OAuth2.0 Client Credentials", encryption: "TLS 1.3", notes: "Mediated API route"}

    - {from: "CMP-06", to: "CMP-05", protocol: "Kafka/TLS", auth: "SASL/SCRAM", encryption: "TLS 1.3"}
    - {from: "CMP-07", to: "CMP-05", protocol: "Kafka/TLS", auth: "SASL/SCRAM", encryption: "TLS 1.3"}
    - {from: "CMP-08", to: "CMP-05", protocol: "Kafka/TLS", auth: "SASL/SCRAM", encryption: "TLS 1.3"}
    - {from: "CMP-09", to: "CMP-05", protocol: "Kafka/TLS", auth: "SASL/SCRAM", encryption: "TLS 1.3"}
    - {from: "CMP-10", to: "CMP-05", protocol: "Kafka/TLS", auth: "SASL/SCRAM", encryption: "TLS 1.3"}

    - {from: "CMP-06", to: "CMP-12", protocol: "JDBC/TLS", auth: "PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-07", to: "CMP-13", protocol: "JDBC/TLS", auth: "PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-08", to: "CMP-13", protocol: "JDBC/TLS", auth: "PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-09", to: "CMP-12", protocol: "JDBC/TLS", auth: "PWD from Kubernetes Secrets", encryption: "TLS 1.3", notes: "Group routes to authorized schemas only"}
    - {from: "CMP-09", to: "CMP-13", protocol: "JDBC/TLS", auth: "PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-09", to: "CMP-14", protocol: "JDBC/TLS", auth: "PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-09", to: "CMP-15", protocol: "JDBC/TLS", auth: "PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-09", to: "CMP-16", protocol: "JDBC/TLS", auth: "PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-10", to: "CMP-12", protocol: "JDBC/TLS", auth: "PWD from Kubernetes Secrets", encryption: "TLS 1.3", notes: "Group routes to authorized schemas only"}
    - {from: "CMP-10", to: "CMP-13", protocol: "JDBC/TLS", auth: "PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-10", to: "CMP-14", protocol: "JDBC/TLS", auth: "PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-10", to: "CMP-15", protocol: "JDBC/TLS", auth: "PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-10", to: "CMP-16", protocol: "JDBC/TLS", auth: "PWD from Kubernetes Secrets", encryption: "TLS 1.3"}

    - {from: "CMP-06", to: "CMP-17", protocol: "Redis/TLS", auth: "ACL + PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-07", to: "CMP-17", protocol: "Redis/TLS", auth: "ACL + PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-08", to: "CMP-17", protocol: "Redis/TLS", auth: "ACL + PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-09", to: "CMP-17", protocol: "Redis/TLS", auth: "ACL + PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-10", to: "CMP-17", protocol: "Redis/TLS", auth: "ACL + PWD from Kubernetes Secrets", encryption: "TLS 1.3"}
    - {from: "CMP-06", to: "CMP-18", protocol: "AMQPS/TLS", auth: "SASL/SCRAM", encryption: "TLS 1.3"}
    - {from: "CMP-07", to: "CMP-18", protocol: "AMQPS/TLS", auth: "SASL/SCRAM", encryption: "TLS 1.3"}
    - {from: "CMP-08", to: "CMP-18", protocol: "AMQPS/TLS", auth: "SASL/SCRAM", encryption: "TLS 1.3"}
    - {from: "CMP-09", to: "CMP-18", protocol: "AMQPS/TLS", auth: "SASL/SCRAM", encryption: "TLS 1.3"}
    - {from: "CMP-10", to: "CMP-18", protocol: "AMQPS/TLS", auth: "SASL/SCRAM", encryption: "TLS 1.3"}
    - {from: "CMP-06", to: "CMP-19", protocol: "HTTPS/TLS 1.3", auth: "OAuth2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-07", to: "CMP-19", protocol: "HTTPS/TLS 1.3", auth: "OAuth2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-08", to: "CMP-19", protocol: "HTTPS/TLS 1.3", auth: "OAuth2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-09", to: "CMP-19", protocol: "HTTPS/TLS 1.3", auth: "OAuth2.0 Client Credentials", encryption: "TLS 1.3"}
