_design:
  template: "gcp-hub-spoke"
  decisions:
    - choice: "One Shared VPC host project owns the network; the service project owns the workloads"
      rationale: "In a Shared VPC the network boundary is the host project, so drawing a second VPC would invent a boundary that does not exist."
    - choice: "The on-premises ERP is reached through Cloud Interconnect with IPSec, never the internet"
      rationale: "Analytics reads ERP data; the path must stay on the private WAN and be inspectable."
    - choice: "BigQuery and Cloud Storage sit in the VPC Service Controls perimeter with CMEK"
      rationale: "Order and customer data is Confidential; egress from the perimeter must be an explicit decision."
    - choice: "Workloads hold no external IP; egress is Cloud NAT only"
      rationale: "A workload with a public IP bypasses Cloud Armor, the perimeter, and egress logging."
  open_implementation_checks:
    - "Confirm GCP region and Interconnect capacity with the network team."
    - "Confirm the BigQuery dataset retention and the CMEK key rotation period."
    - "Legal must approve the analytics extract if it leaves the approved region."

arch:
  id: "ANA-GCP-001-TechDiagram-V1.0"
  name: "Analytics API (ANA) - Google Cloud Shared VPC and On-Premises Hybrid"
  platform: "hybrid_cloud"
  version: "V1.0"
  author: "TBD"
  owner_team: "Data Platform"
  last_modified: "2026-09-24"

  deployment:

    # ── Google Cloud Shared VPC (host project owns the network) ──
    - id: "gcp-host-project"
      type: "gcp_vpc"
      role: "production"
      location: "Google Cloud host project [REGION]"
      owner: "InfraSec"
      subnets:
        - id: "gcp-ingress-subnet"
          type: "public"
          name: "Shared ingress subnet"
          components:
            - id: "INF-08"
              name: "INF-08 | Cloud Armor"
              type: "SEC"
              shape: "hexagon"
              node_kind: "waf"
              runtime: "Google Cloud managed service"
              owner_type: "org_it"
              status: "newly_created"
              notes: "OWASP rules, rate limiting, and source restrictions; the only public entry point."

            - id: "INF-09"
              name: "INF-09 | Global HTTPS load balancer"
              type: "LB"
              shape: "trapezoid"
              runtime: "Google Cloud managed service"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Global external HTTPS LB in front of the API runtime."

        - id: "gcp-egress-subnet"
          type: "private"
          name: "Shared egress subnet"
          components:
            - id: "INF-10"
              name: "INF-10 | Cloud NAT"
              type: "NW"
              shape: "hexagon"
              node_kind: "router"
              runtime: "Google Cloud managed service"
              owner_type: "org_it"
              status: "newly_created"
              notes: "All workload egress; no workload holds an external IP."

            - id: "INF-11"
              name: "INF-11 | Cloud Interconnect"
              type: "NW"
              shape: "hexagon"
              node_kind: "vpn_gateway"
              runtime: "Google Cloud managed service"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Private path to the on-premises DC with IPSec encryption."

        - id: "gcp-app-subnet"
          type: "private"
          name: "Private runtime subnet"
          components:

            - id: "CMP-01"
              name: "CMP-01 | Analytics API"
              type: "BE"
              language: "Go-1.23"
              framework: "net/http"
              runtime: "GKE private cluster"
              sensitivity: "Acme Confidential"
              owner_type: "biz_owned"
              status: "newly_created"
              notes: "Serves analytics queries to internal consumers."

            - id: "CMP-02"
              name: "CMP-02 | Analytics worker"
              type: "BE"
              language: "Python-3.12"
              framework: "TBD"
              runtime: "GKE private cluster"
              sensitivity: "Acme Confidential"
              owner_type: "biz_owned"
              status: "newly_created"
              notes: "Ingests ERP extracts and loads the warehouse."

        - id: "gcp-data-subnet"
          type: "private"
          name: "Private data subnet"
          components:
            - id: "CMP-03"
              name: "CMP-03 | BigQuery warehouse"
              type: "DB"
              shape: "cylinder"
              sensitivity: "Acme Confidential"
              encryption_at_rest: "CMEK"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Dataset inside the VPC Service Controls perimeter."

            - id: "CMP-04"
              name: "CMP-04 | Cloud Storage stage"
              type: "DS"
              sensitivity: "Acme Confidential"
              encryption_at_rest: "CMEK"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Staging bucket for ERP extracts; private access only."

            - id: "INF-12"
              name: "INF-12 | Secret Manager"
              type: "SEC"
              shape: "circle"
              node_kind: "key_management"
              runtime: "Google Cloud managed service"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Workload credentials and API keys; no static secrets in the image."

    # ── On-premises private DC ───────────────────────────────────
    - id: "dc-primary"
      type: "private_dc"
      role: "production"
      location: "Primary DC [CN]"
      owner: "InfraSec"
      network_zones:
        - id: "dc-intranet"
          type: "intranet"
          name: "Intranet"
          components:
            - id: "CMP-05"
              name: "CMP-05 | ERP extract service"
              type: "IP"
              shape: "parallelogram"
              runtime: "Internal K8s Platform"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "unchanged"
              notes: "Only boundary into the ERP zone; produces the signed extracts."

            - id: "CMP-06"
              name: "CMP-06 | ERP core"
              type: "BE"
              owner_type: "org_it"
              status: "unchanged"
              sensitivity: "Acme Restricted"
              notes: "System of record; read by the extract service only."

            - id: "INF-13"
              name: "INF-13 | Enterprise directory"
              type: "SEC"
              shape: "circle"
              node_kind: "identity_provider"
              runtime: "On-premises identity service"
              owner_type: "org_it"
              status: "unchanged"
              notes: "Internal sign-in, federated to Cloud Identity."

  interactions:
    - from: "internet"
      to: "INF-08"
      protocol: "HTTPS/TLS 1.3"
      auth: "OIDC"
      encryption: "TLS1.3"
      notes: "Customer and partner entry; Cloud Armor policy applies first."

    - from: "INF-08"
      to: "INF-09"
      protocol: "HTTPS/TLS 1.3"
      auth: "none"
      encryption: "TLS1.3"
      notes: "Inspection then load balancing."

    - from: "INF-09"
      to: "CMP-01"
      protocol: "HTTPS/TLS 1.3"
      auth: "OAuth2.0 Client Credentials"
      encryption: "TLS1.3"

    - from: "CMP-01"
      to: "CMP-03"
      protocol: "HTTPS/gRPC"
      auth: "IAM Role"
      encryption: "TLS1.3"
      via: ["INF-12"]
      notes: "Inside the VPC Service Controls perimeter."

    - from: "CMP-02"
      to: "CMP-04"
      protocol: "HTTPS/TLS 1.3"
      auth: "IAM Role"
      encryption: "TLS1.3"
      via: ["INF-12"]

    - from: "CMP-02"
      to: "INF-12"
      protocol: "HTTPS/TLS 1.3"
      auth: "ManagedIdentity"
      encryption: "TLS1.3"
      notes: "Runtime secret access; no static credentials."

    - from: "CMP-02"
      to: "CMP-05"
      protocol: "HTTPS/TLS 1.3"
      auth: "ClientCertificate"
      encryption: "IPSec"
      via: ["INF-11"]
      cross_border: true
      notes: "ERP extracts over Interconnect; data minimized and classified."

    - from: "CMP-05"
      to: "CMP-06"
      protocol: "JDBC/PostgreSQL"
      auth: "UserPassword"
      encryption: "TLS1.3"
      notes: "Extract service is the only reader of the ERP schema."

    - from: "user"
      to: "INF-13"
      protocol: "HTTPS/SAML 2.0"
      auth: "SAML2"
      encryption: "TLS1.3"
      notes: "Internal sign-in with MFA, federated to Cloud Identity."

  security:
    key_management:
      private_dc: "Enterprise vault for ERP credentials; automated rotation"
      other: "Cloud KMS with CMEK for BigQuery and Cloud Storage; Secret Manager for runtime credentials"
    user_auth_internal:
      server: "INF-12 | Enterprise directory"
      protocol: "SAML 2.0 with MFA, federated to Cloud Identity"
    user_auth_external:
      server: "INF-12 | Enterprise directory"
      protocol: "OIDC / OAuth2.0 Authorization Code with PKCE"
    network_segmentation:
      ingress: "Internet traffic enters via Cloud Armor and the global HTTPS LB; workloads hold no external IP"
      east_west: "Service-to-service inside the shared VPC; data services inside the VPC Service Controls perimeter"
      external: "All egress through Cloud NAT; no workload has a public IP"
      inter_dc: "Cloud Interconnect with IPSec; no direct database replication across regions"
      database: "BigQuery and Cloud Storage accept workloads from the runtime subnet only"
    data_protection:
      in_transit: "TLS 1.3 preferred; mTLS for the ERP boundary; IPSec over Interconnect"
      at_rest: "CMEK for BigQuery and Cloud Storage; AES-256 for the on-premises ERP"
      cross_border: "ERP extracts are minimized and classified before crossing; Privacy and Legal approval required"
    monitoring:
      centralized: "Cloud Logging sinks to the security project; Cloud Monitoring alerts on the API"
