      aws: "Peer-owned AWS KMS and Secrets Manager; short-lived credentials at the integration boundary"
      azure: "Peer-owned Azure Key Vault and managed identity; short-lived credentials at the integration boundary"
    user_auth_internal:
      server: "INF-22 | ADFS"
      protocol: "SAML 2.0 over TLS 1.3 with MFA and signed assertions"
    user_auth_external:
      server: "Not applicable - employee-only platform"
      protocol: "No external-user entry point"
    authorization:
      platform: "AuthZ Platform"
      enforcement: "Spring Cloud Gateway plus application-level RBAC; least-privilege service and database roles"
    bastion:
      unified: "Privileged Access Workstation (PAW)"
      access_path: "Office Network -> PAW with MFA -> approved private management plane"
    operational_access:
      - "No public SSH or RDP"
      - "MFA and named privileged accounts are mandatory"
      - "Administrative sessions are approved, logged, monitored, and time bounded"
      - "CN and NA production privileges are region-scoped"
    data_protection:
      in_transit: "TLS 1.3 on all application, messaging, database, identity, and cloud-peer paths; SAP RFC uses SNC with AES-256"
      at_rest: "AES-256 or platform-equivalent encryption for databases, search, cache persistence, message logs, backups, and K8s Secrets"
      cross_border: "Only minimized order events traverse CN and NA through CMP-14-CN and CMP-14-NA; no direct database replication; approved legal basis and retention policy required"
    network_security:
      segmentation: "Default deny between ingress, K8s/application, integration, SAP, server, DB, identity, AWS, and Azure zones; permit only declared flows"
      egress: "Cloud egress is allow-listed through CMP-13-NA or CMP-14-NA; CN peer egress is allow-listed through CMP-11, CMP-12, CMP-13-CN, or CMP-14-CN"
      inspection: "F5 ingress and optional WAF policy are symmetric across CN and NA; enterprise firewalls enforce inter-zone and cross-region policy"
    audit_monitoring:
      controls: "Centralized immutable audit logs, authentication events, API-gateway decisions, Kafka/RabbitMQ security events, database audit records, and privileged-session monitoring"
      alerting: "Security operations alerting for failed authentication, anomalous cross-border event volume, secret access, and denied east-west traffic"
    resilience:
      topology: "Active-active regional application stacks serving local users; independent regional database groups; CDC event synchronization only"
      recovery: "Encrypted backups remain in-region; restoration and cross-region failover are exercised without database replication"
