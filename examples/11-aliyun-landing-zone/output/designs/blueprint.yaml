_design:
  template: "aliyun-landing-zone"
  decisions:
    - choice: "A central account owns a hub VPC; business workloads live in a separate VPC linked by CEN"
      rationale: "Account and VPC separation is the Alibaba landing-zone control: cross-VPC and cross-region traffic is forced through one inspectable hub."
    - choice: "Ingress is Anti-DDoS then WAF then SLB; no workload holds an Elastic IP"
      rationale: "An EIP on a workload bypasses scrubbing, WAF inspection, and egress logging at once."
    - choice: "Workloads use RAM roles with STS tokens, never a long-lived AccessKey"
      rationale: "A leaked AccessKey is equivalent to account compromise and cannot be attributed to a session."
    - choice: "Two application vSwitches in different availability zones"
      rationale: "A single-AZ deployment fails the availability requirement; vSwitch is the zone-level unit in VPC."
  open_implementation_checks:
    - "Confirm the resource-directory folder layout and account naming with the cloud platform team."
    - "Confirm CEN bandwidth packages and the Express Connect circuit to the DC."
    - "Confirm KMS key rotation and OSS bucket policy for the restricted bucket."

arch:
  id: "ORD-ALI-001-TechDiagram-V1.0"
  name: "Order Service Platform (ORD) - Alibaba Cloud Landing Zone with On-Premises ERP"
  platform: "hybrid_cloud"
  version: "V1.0"
  author: "TBD"
  owner_team: "Cloud Platform"
  last_modified: "2026-09-24"

  deployment:

    # ── Central VPC: shared network and security services ────────
    - id: "aliyun-central-vpc"
      type: "aliyun_vpc"
      role: "production"
      location: "Alibaba Cloud central VPC (hub) [cn-hangzhou]"
      owner: "InfraSec"
      subnets:
        - id: "central-edge"
          type: "public"
          name: "Edge vSwitch (AZ-A)"
          components:
            - id: "INF-10"
              name: "INF-10 | Anti-DDoS"
              type: "SEC"
              shape: "hexagon"
              node_kind: "security_gateway"
              runtime: "Alibaba Cloud managed service"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Traffic scrubbing before inspection."

            - id: "INF-11"
              name: "INF-11 | Web application firewall"
              type: "SEC"
              shape: "hexagon"
              node_kind: "waf"
              runtime: "Alibaba Cloud managed service"
              owner_type: "org_it"
              status: "newly_created"
              notes: "OWASP rules and rate limiting."

            - id: "INF-12"
              name: "INF-12 | Server load balancer"
              type: "LB"
              shape: "trapezoid"
              runtime: "Alibaba Cloud managed service"
              owner_type: "org_it"
              status: "newly_created"
              notes: "ALB/SLB in front of the application vSwitches."

        - id: "central-shared"
          type: "private"
          name: "Shared services vSwitch (AZ-A)"
          components:
            - id: "INF-13"
              name: "INF-13 | Cloud firewall"
              type: "SEC"
              shape: "hexagon"
              node_kind: "firewall"
              runtime: "Alibaba Cloud managed service"
              owner_type: "org_it"
              status: "newly_created"
              notes: "East-west inspection between vSwitches and VPCs."

            - id: "INF-14"
              name: "INF-14 | NAT gateway"
              type: "NW"
              shape: "hexagon"
              node_kind: "router"
              runtime: "Alibaba Cloud managed service"
              owner_type: "org_it"
              status: "newly_created"
              notes: "The only egress path; no workload holds an EIP."

            - id: "INF-15"
              name: "INF-15 | Cloud Enterprise Network"
              type: "NW"
              shape: "hexagon"
              node_kind: "router"
              runtime: "Alibaba Cloud managed service"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Hub for every cross-VPC and cross-region path, including Express Connect."

            - id: "INF-16"
              name: "INF-16 | Log service"
              type: "BE"
              runtime: "Alibaba Cloud managed service"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Central collection, audit, and alerting."

    # ── Business VPC: workloads across two availability zones ────
    - id: "aliyun-business-vpc"
      type: "aliyun_vpc"
      role: "production"
      location: "Alibaba Cloud business VPC [cn-hangzhou]"
      owner: "Business IT"
      subnets:
        - id: "business-az-a"
          type: "private"
          name: "Application vSwitch (AZ-A)"
          components:
            - id: "CMP-01"
              name: "CMP-01 | Order service"
              type: "BE"
              language: "Java-17"
              framework: "Spring Boot-3.5.2"
              runtime: "ACK cluster"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Primary instance; reads and writes the order database."

        - id: "business-az-b"
          type: "private"
          name: "Application vSwitch (AZ-B)"
          components:
            - id: "CMP-02"
              name: "CMP-02 | Order service (AZ-B)"
              type: "BE"
              language: "Java-17"
              framework: "Spring Boot-3.5.2"
              runtime: "ACK cluster"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Second availability zone; shares the database with CMP-01."

        - id: "business-data"
          type: "private"
          name: "Data vSwitch (AZ-A)"
          components:
            - id: "CMP-03"
              name: "CMP-03 | Order database"
              type: "DB"
              shape: "cylinder"
              sensitivity: "Acme Confidential"
              encryption_at_rest: "KMS"
              owner_type: "org_it"
              status: "newly_created"
              notes: "PolarDB/RDS with private endpoint only."

            - id: "CMP-04"
              name: "CMP-04 | Object storage bucket"
              type: "DS"
              sensitivity: "Acme Confidential"
              encryption_at_rest: "KMS"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Order document archive; private access only."

            - id: "INF-17"
              name: "INF-17 | KMS secret manager"
              type: "SEC"
              shape: "circle"
              node_kind: "key_management"
              runtime: "Alibaba Cloud managed service"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Holds database passwords and rotation policy."

    # ── On-premises private DC ───────────────────────────────────
    - id: "dc-primary"
      type: "private_dc"
      role: "production"
      location: "Primary DC [CN]"
      owner: "InfraSec"
      network_zones:
        - id: "dc-intranet"
          type: "intranet"
          name: "Intranet"
          components:
            - id: "CMP-05"
              name: "CMP-05 | ERP integration boundary"
              type: "IP"
              shape: "parallelogram"
              runtime: "Internal K8s Platform"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "unchanged"
              notes: "Only boundary into the ERP zone; publishes order status."

            - id: "CMP-06"
              name: "CMP-06 | ERP core"
              type: "BE"
              owner_type: "org_it"
              status: "unchanged"
              sensitivity: "Acme Restricted"
              notes: "System of record; read by the boundary service only."

            - id: "INF-18"
              name: "INF-18 | Enterprise IdP"
              type: "SEC"
              shape: "circle"
              node_kind: "identity_provider"
              runtime: "On-premises identity service"
              owner_type: "org_it"
              status: "unchanged"
              notes: "Internal sign-in, federated to RAM SSO."

  interactions:
    - from: "CMP-01"
      to: "CMP-03"
      protocol: "JDBC/MySQL"
      auth: "UserPassword"
      encryption: "TLS1.3"
      notes: "Credentials come from INF-17; private endpoint only."

    - from: "CMP-02"
      to: "CMP-03"
      protocol: "JDBC/MySQL"
      auth: "UserPassword"
      encryption: "TLS1.3"
      notes: "Cross-AZ access inside the business VPC."

    - from: "CMP-01"
      to: "CMP-04"
      protocol: "HTTPS/TLS 1.3"
      auth: "IAMRole"
      encryption: "TLS1.3"
      notes: "Runtime RAM role with STS token; no static AccessKey."

    - from: "CMP-01"
      to: "CMP-05"
      protocol: "HTTPS/TLS 1.3"
      auth: "ClientCertificate"
      encryption: "IPSec"
      via: ["INF-13", "INF-15"]
      notes: "Order status over CEN and Express Connect; inspected by the cloud firewall."

    - from: "CMP-05"
      to: "CMP-06"
      protocol: "JDBC/SQLServer"
      auth: "UserPassword"
      encryption: "TLS1.2"
      notes: "Boundary service is the only reader of the ERP schema."

  security:
    key_management:
      private_dc: "Enterprise vault for ERP credentials; automated rotation"
      other: "KMS 凭据管家 with per-class CMKs for the database and the bucket"
    user_auth_internal:
      server: "INF-18 | Enterprise IdP"
      protocol: "SAML 2.0 with MFA, federated to RAM SSO"
    network_segmentation:
      ingress: "Anti-DDoS then WAF then SLB; no workload holds an EIP"
      east_west: "Cloud firewall between vSwitches; CEN between VPCs"
      external: "Egress through the NAT gateway only"
      database: "Data vSwitch accepts private connections from the application vSwitches only"
    data_protection:
      in_transit: "TLS 1.3 preferred; IPSec over Express Connect to the DC"
      at_rest: "KMS CMK for PolarDB and OSS"
      classification: "Acme Restricted data stays in the ERP; no restricted data in the cloud database"
    monitoring:
      centralized: "Log service collects VPC flow logs, WAF alerts, and ActionTrail"
