    - {id: "FLOW-02", source_component_id: "CMP-01", target_component_id: "CMP-03", protocol: "gRPC", port: "443", auth_method: "IAM_Role", encryption: "TLS1.3", cross_border: false, notes: "Inside the VPC Service Controls perimeter"}
    - {id: "FLOW-03", source_component_id: "CMP-02", target_component_id: "CMP-04", protocol: "HTTPS", port: "443", auth_method: "IAM_Role", encryption: "TLS1.3", cross_border: false, notes: "Least-privilege bucket role"}
    - {id: "FLOW-04", source_component_id: "CMP-02", target_component_id: "CMP-05", protocol: "HTTPS", port: "443", auth_method: "ClientCertificate", encryption: "IPSec", cross_border: true, cross_border_basis: "Extracts minimized and classified; Privacy and Legal approval required", via: ["INF-11"], notes: "ERP extracts over Cloud Interconnect"}
    - {id: "FLOW-05", source_component_id: "CMP-05", target_component_id: "CMP-06", protocol: "JDBC", port: "5432", auth_method: "UserPassword", encryption: "TLS1.3", cross_border: false, notes: "Single reader of the ERP schema"}

