arch:
  id: "OSP-001-TechDiagram-V1.0"
  name: "Supply-Chain Order Platform (OSP) - Active-Active CN and NA Technical Architecture"
  platform: "hybrid_cloud"
  version: "V1.0"
  author: "Architecture Team"
  owner_team: "Supply Chain IT"
  last_modified: "2026-09-14"

  deployment:
    - id: "dc-cn-primary"
      type: "private_dc"
      role: "production"
      location: "City A, Province A [CN]"
      owner: "InfraSec"
      network_zones:
        - id: "cn-intranet"
          type: "intranet"
          name: "Intranet"
          components:
            - {id: "INF-16", name: "INF-16 | F5", type: "LB", shape: "hexagon", language: "N/A", framework: "F5", runtime: "Network appliance", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN ingress load balancer"}
            - {id: "INF-17", name: "INF-17 | WAF", type: "LB", shape: "hexagon", language: "N/A", framework: "Enterprise WAF", runtime: "Security appliance", sensitivity: "Company Confidential", owner_type: "org_it", status: "in_plan", notes: "Optional CN WAF; enable after security-owner decision"}
            - {id: "INF-18", name: "INF-18 | Edge router", type: "NW", language: "N/A", framework: "Edge router", runtime: "Network platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN edge routing boundary"}
            - {id: "CMP-01-CN", name: "CMP-01-CN | scop-cn-web", type: "FE", language: "N/A", framework: "Nginx", runtime: "Private DC web tier", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN employee web tier"}

        - id: "cn-app-zone"
          type: "app_zone"
          name: "App Zone"
          components:
            - {id: "CMP-02-CN", name: "CMP-02-CN | Spring Cloud Gateway", type: "IP", shape: "parallelogram", language: "Java", framework: "Spring Cloud Gateway", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN application gateway"}
            - {id: "CMP-03-CN", name: "CMP-03-CN | Order Creation", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-04-CN", name: "CMP-04-CN | Order Change", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-05-CN", name: "CMP-05-CN | Data Distribution", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-06-CN", name: "CMP-06-CN | Master Data", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-07-CN", name: "CMP-07-CN | Order Inquiry", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-08-CN", name: "CMP-08-CN | Basic Operation", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-09-CN", name: "CMP-09-CN | Logging", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-10-CN", name: "CMP-10-CN | etc.", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-11", name: "CMP-11 | APIM", type: "IP", shape: "parallelogram", language: "N/A", framework: "APIM", runtime: "Integration platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "unchanged", notes: "CN API management boundary"}
            - {id: "CMP-12", name: "CMP-12 | WSO2", type: "IP", shape: "parallelogram", language: "N/A", framework: "WSO2 API Gateway", runtime: "Integration platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "unchanged", notes: "CN API gateway boundary"}
            - {id: "CMP-13-CN", name: "CMP-13-CN | APIH", type: "IP", shape: "parallelogram", language: "N/A", framework: "APIH", runtime: "Integration platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "unchanged", notes: "CN API mediation boundary"}
            - {id: "CMP-14-CN", name: "CMP-14-CN | Kafka", type: "MQ", shape: "message_queue", language: "N/A", framework: "Kafka", runtime: "Messaging platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN event and CDC publication bus"}
            - {id: "CMP-15-CN", name: "CMP-15-CN | RabbitMQ", type: "MQ", shape: "message_queue", language: "N/A", framework: "RabbitMQ", runtime: "Messaging platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN CDC staging bus"}
            - {id: "CMP-16-CN", name: "CMP-16-CN | Debezium", type: "IP", shape: "parallelogram", language: "Java", framework: "Debezium", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN CDC connector; no direct cross-region database replication"}
            - {id: "CMP-33", name: "CMP-33 | ECC-CN", type: "API", language: "N/A", framework: "SAP ECC Function and SLT", runtime: "Existing ERP platform", sensitivity: "Company Confidential", owner: "third_party", owner_type: "third_party", status: "unchanged"}
            - {id: "CMP-34", name: "CMP-34 | S4-CN", type: "API", language: "N/A", framework: "SAP S/4 Function and SLT", runtime: "Existing ERP platform", sensitivity: "Company Confidential", owner: "third_party", owner_type: "third_party", status: "unchanged"}
            - {id: "CMP-25", name: "CMP-25 | eComm-order-platform", type: "BE", language: "N/A", framework: "Existing application", runtime: "CN private platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}
            - {id: "CMP-26", name: "CMP-26 | SOS(sales order service)-PRC", type: "BE", language: "N/A", framework: "Existing application", runtime: "CN private platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}
            - {id: "CMP-27", name: "CMP-27 | CFOS(customer order fullfillment service)-PRC", type: "BE", language: "N/A", framework: "Existing application", runtime: "CN private platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}
            - {id: "CMP-28", name: "CMP-28 | CFOS(customer order fullfillment service)-AP", type: "BE", language: "N/A", framework: "Existing application", runtime: "CN private platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}
            - {id: "CMP-29", name: "CMP-29 | SSCS(Service supply chain service)-AP", type: "BE", language: "N/A", framework: "Existing application", runtime: "CN private platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}

        - id: "cn-db-zone"
          type: "db_zone"
          name: "DB Zone"
          components:
            - {id: "CMP-17-CN", name: "CMP-17-CN | Elasticsearch HA", type: "DB", shape: "cylinder", language: "N/A", framework: "Elasticsearch HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "Encrypted search index"}
            - {id: "CMP-18-CN", name: "CMP-18-CN | Redis HA", type: "DB", shape: "cylinder", language: "N/A", framework: "Redis HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "Encrypted cache persistence"}
            - {id: "CMP-19", name: "CMP-19 | MySQL HA", type: "DB", shape: "cylinder", language: "N/A", framework: "MySQL HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN-only relational group; AES-256 at rest"}
            - {id: "CMP-20-CN", name: "CMP-20-CN | PostgreSQL HA", type: "DB", shape: "cylinder", language: "N/A", framework: "PostgreSQL HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "AES-256 at rest"}
            - {id: "CMP-21-CN", name: "CMP-21-CN | SQLServer HA", type: "DB", shape: "cylinder", language: "N/A", framework: "SQL Server HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "TDE AES-256 at rest"}

    - id: "dc-us"
      type: "private_dc"
      role: "production"
      location: "City C, State X [US]"
      owner: "InfraSec"
      network_zones:
        - id: "na-prod-ina-earth"
          type: "intranet"
          name: "NA-PROD-INA-EARTH"
          components:
            - {id: "INF-19", name: "INF-19 | F5", type: "LB", shape: "hexagon", language: "N/A", framework: "F5", runtime: "Network appliance", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "NA ingress load balancer"}
            - {id: "INF-20", name: "INF-20 | WAF", type: "LB", shape: "hexagon", language: "N/A", framework: "Enterprise WAF", runtime: "Security appliance", sensitivity: "Company Confidential", owner_type: "org_it", status: "in_plan", notes: "Optional NA WAF; enable after security-owner decision"}
            - {id: "INF-21", name: "INF-21 | Edge router", type: "NW", language: "N/A", framework: "Edge router", runtime: "Network platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "NA edge routing boundary"}

        - id: "na-prod-ina-k8s"
          type: "app_zone"
          name: "NA-PROD-INA-K8S"
          components:
            - {id: "CMP-01-NA", name: "CMP-01-NA | osp-na-web", type: "FE", language: "N/A", framework: "Nginx", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "NA employee web tier"}
            - {id: "CMP-02-NA", name: "CMP-02-NA | Spring Cloud Gateway", type: "IP", shape: "parallelogram", language: "Java", framework: "Spring Cloud Gateway", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "NA application gateway"}
            - {id: "CMP-03-NA", name: "CMP-03-NA | Order Creation", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-04-NA", name: "CMP-04-NA | Order Change", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-05-NA", name: "CMP-05-NA | Data Distribution", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-06-NA", name: "CMP-06-NA | Master Data", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-07-NA", name: "CMP-07-NA | Order Inquiry", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-08-NA", name: "CMP-08-NA | Basic Operation", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-09-NA", name: "CMP-09-NA | Logging", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-10-NA", name: "CMP-10-NA | etc.", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "CMP-22", name: "CMP-22 | ERPS（ERP service）", type: "BE", language: "N/A", framework: "Existing application", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}
            - {id: "CMP-23", name: "CMP-23 | LGS(logistics gateway service)-NA", type: "BE", language: "N/A", framework: "Existing application", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}
            - {id: "CMP-24", name: "CMP-24 | IBS(Installbase service)", type: "BE", language: "N/A", framework: "Existing application", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}

        - id: "na-prod-ina-integration"
          type: "app_zone"
          name: "NA-PROD-INA-INTEGRATION"
          components:
            - {id: "CMP-13-NA", name: "CMP-13-NA | APIH", type: "IP", shape: "parallelogram", language: "N/A", framework: "APIH", runtime: "Integration platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "unchanged", notes: "Sole NA cross-application API mediator"}
            - {id: "CMP-14-NA", name: "CMP-14-NA | Kafka", type: "MQ", shape: "message_queue", language: "N/A", framework: "Kafka", runtime: "Messaging platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "Sole NA cross-application event mediator"}

        - id: "na-prod-ina-sap"
          type: "app_zone"
          name: "NA-PROD-INA-SAP"
          components:
            - {id: "CMP-35", name: "CMP-35 | S4-NA", type: "API", language: "N/A", framework: "SAP S/4 Function and SLT", runtime: "Existing ERP platform", sensitivity: "Company Confidential", owner: "third_party", owner_type: "third_party", status: "unchanged"}

        - id: "na-prod-ina-server"
          type: "app_zone"
          name: "NA-PROD-INA-SERVER"
          components:
            - {id: "CMP-15-NA", name: "CMP-15-NA | RabbitMQ", type: "MQ", shape: "message_queue", language: "N/A", framework: "RabbitMQ", runtime: "Messaging platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "NA CDC staging bus"}
            - {id: "CMP-16-NA", name: "CMP-16-NA | Debezium", type: "IP", shape: "parallelogram", language: "Java", framework: "Debezium", runtime: "Server platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "NA CDC connector; no direct cross-region database replication"}

        - id: "na-prod-ina-db"
          type: "db_zone"
          name: "NA-PROD-INA-DB"
          components:
            - {id: "CMP-17-NA", name: "CMP-17-NA | Elasticsearch HA", type: "DB", shape: "cylinder", language: "N/A", framework: "Elasticsearch HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "Encrypted search index"}
            - {id: "CMP-18-NA", name: "CMP-18-NA | Redis HA", type: "DB", shape: "cylinder", language: "N/A", framework: "Redis HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "Encrypted cache persistence"}
            - {id: "CMP-20-NA", name: "CMP-20-NA | PostgreSQL HA", type: "DB", shape: "cylinder", language: "N/A", framework: "PostgreSQL HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "AES-256 at rest"}
            - {id: "CMP-21-NA", name: "CMP-21-NA | SQLServer HA", type: "DB", shape: "cylinder", language: "N/A", framework: "SQL Server HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "TDE AES-256 at rest"}

    - id: "dc-us-identity"
      type: "private_dc"
      role: "production"
      location: "City C, State X [US]"
      owner: "InfraSec"
      network_zones:
        - id: "identity-app-zone"
          type: "app_zone"
          name: "App Zone"
          components:
            - {id: "INF-22", name: "INF-22 | ADFS", type: "SEC", shape: "circle", language: "N/A", framework: "ADFS", runtime: "Existing identity platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "unchanged", notes: "Employee SSO with MFA policy enforcement"}

    - id: "aws-us"
      type: "aws_vpc"
      role: "production"
      location: "AWS US East, N. Virginia [US]"
      owner: "Third Party"
      subnets:
        - id: "aws-us-private-app"
          type: "private"
          name: "Private subnet (APP)"
          components:
            - {id: "CMP-30", name: "CMP-30 | SOS(sales order service)-ROW", type: "BE", language: "N/A", framework: "Existing application", runtime: "AWS private application subnet", sensitivity: "Company Confidential", owner: "third_party", owner_type: "third_party", status: "unchanged", notes: "AWS US event consumer"}

    - id: "azure-us"
      type: "azure_vnet"
      role: "production"
      location: "Azure US [US]"
      owner: "Third Party"
      subnets:
        - id: "azure-us-app-zone"
          type: "spoke"
          name: "APP Zone"
          components:
            - {id: "CMP-31", name: "CMP-31 | edge-cache", type: "BE", language: "N/A", framework: "Existing Azure application", runtime: "Azure application platform", sensitivity: "Company Confidential", owner: "third_party", owner_type: "third_party", status: "unchanged"}
            - {id: "CMP-32", name: "CMP-32 | D365", type: "BE", shape: "cloud_rect", language: "N/A", framework: "Dynamics 365", runtime: "Microsoft SaaS", sensitivity: "Company Confidential", owner: "third_party", owner_type: "third_party", status: "unchanged"}

  interactions:
    # Employee ingress and SSO; optional WAFs remain explicitly visible in each symmetric path.
    - {from: "INF-16", to: "INF-17", protocol: "HTTPS", auth: "Mutual TLS", encryption: "TLS 1.3", notes: "CN optional WAF inspection"}
    - {from: "INF-17", to: "INF-18", protocol: "HTTPS", auth: "Mutual TLS", encryption: "TLS 1.3"}
    - {from: "INF-18", to: "CMP-01-CN", protocol: "HTTPS", auth: "Mutual TLS", encryption: "TLS 1.3"}
    - {from: "CMP-01-CN", to: "INF-22", protocol: "HTTPS/SAML 2.0", auth: "SAML 2.0", encryption: "TLS 1.3", notes: "CN employee SSO"}
    - {from: "CMP-01-CN", to: "CMP-02-CN", protocol: "HTTPS", auth: "SAML bearer session token", encryption: "TLS 1.3"}
    - {from: "INF-19", to: "INF-20", protocol: "HTTPS", auth: "Mutual TLS", encryption: "TLS 1.3", notes: "NA optional WAF inspection"}
    - {from: "INF-20", to: "INF-21", protocol: "HTTPS", auth: "Mutual TLS", encryption: "TLS 1.3"}
    - {from: "INF-21", to: "CMP-01-NA", protocol: "HTTPS", auth: "Mutual TLS", encryption: "TLS 1.3"}
    - {from: "CMP-01-NA", to: "INF-22", protocol: "HTTPS/SAML 2.0", auth: "SAML 2.0", encryption: "TLS 1.3", notes: "NA employee SSO"}
    - {from: "CMP-01-NA", to: "CMP-02-NA", protocol: "HTTPS", auth: "SAML bearer session token", encryption: "TLS 1.3"}

    # Regional application-gateway fan-out.
    - {from: "CMP-02-CN", to: "CMP-03-CN", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-CN", to: "CMP-04-CN", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-CN", to: "CMP-05-CN", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-CN", to: "CMP-06-CN", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-CN", to: "CMP-07-CN", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-CN", to: "CMP-08-CN", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-CN", to: "CMP-09-CN", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-CN", to: "CMP-10-CN", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-NA", to: "CMP-03-NA", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-NA", to: "CMP-04-NA", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-NA", to: "CMP-05-NA", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-NA", to: "CMP-06-NA", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-NA", to: "CMP-07-NA", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-NA", to: "CMP-08-NA", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-NA", to: "CMP-09-NA", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-02-NA", to: "CMP-10-NA", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}

    # CN cross-application mediation and regional events.
    - {from: "CMP-03-CN", to: "CMP-13-CN", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-04-CN", to: "CMP-13-CN", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-05-CN", to: "CMP-11", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-06-CN", to: "CMP-12", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-07-CN", to: "CMP-13-CN", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-08-CN", to: "CMP-12", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-09-CN", to: "CMP-11", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-10-CN", to: "CMP-13-CN", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "CMP-03-CN", to: "CMP-14-CN", protocol: "Kafka", auth: "SASL/SCRAM-SHA-512", encryption: "TLS 1.3"}
    - {from: "CMP-04-CN", to: "CMP-14-CN", protocol: "Kafka", auth: "SASL/SCRAM-SHA-512", encryption: "TLS 1.3"}
    - {from: "CMP-05-CN", to: "CMP-14-CN", protocol: "Kafka", auth: "SASL/SCRAM-SHA-512", encryption: "TLS 1.3"}
    - {from: "CMP-06-CN", to: "CMP-14-CN", protocol: "Kafka", auth: "SASL/SCRAM-SHA-512", encryption: "TLS 1.3"}
    - {from: "CMP-07-CN", to: "CMP-14-CN", protocol: "Kafka", auth: "SASL/SCRAM-SHA-512", encryption: "TLS 1.3"}
    - {from: "CMP-08-CN", to: "CMP-14-CN", protocol: "Kafka", auth: "SASL/SCRAM-SHA-512", encryption: "TLS 1.3"}
    - {from: "CMP-09-CN", to: "CMP-14-CN", protocol: "Kafka", auth: "SASL/SCRAM-SHA-512", encryption: "TLS 1.3"}
