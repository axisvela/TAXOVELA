    - {id: "INF-09", name: "Primary DC App Zone", node_kind: "network_zone", infra_type: "private_cloud", network_type: "prod_network", parent_id: "INF-06", country: "CN", status: "active"}
    - {id: "INF-10", name: "Enterprise vault", node_kind: "key_management", infra_type: "private_cloud", network_type: "prod_network", parent_id: "INF-09", country: "CN", status: "active"}

  systems:
    - {id: "APP-01", name: "Expense approval app", type: "new", owner: "biz_owned", vendor: "Microsoft"}
    - {id: "APP-02", name: "Expense backend", type: "existing", owner: "org_it", vendor: "-"}

  components:
    - {id: "CMP-01", system_id: "APP-01", name: "Expense approval app", kind: "component", layer: "fe", component_role: "application_service", sensitivity: "Acme Confidential", status: "active"}
    - {id: "CMP-02", system_id: "APP-01", name: "Approval flow", kind: "service", layer: "be", component_role: "backend_service", sensitivity: "Acme Confidential", status: "active"}
    - {id: "CMP-03", system_id: "APP-01", name: "Dataverse table", kind: "component", layer: "db", component_role: "database", sensitivity: "Acme Confidential", status: "active"}
    - {id: "CMP-04", system_id: "APP-02", name: "On-premises data gateway", kind: "component", layer: "ip", component_role: "integration_service", sensitivity: "Acme Confidential", status: "active"}
    - {id: "CMP-05", system_id: "APP-02", name: "Expense service", kind: "service", layer: "be", component_role: "backend_service", sensitivity: "Acme Confidential", status: "active"}
    - {id: "CMP-06", system_id: "APP-02", name: "Expense database", kind: "component", layer: "db", component_role: "database", sensitivity: "Acme Restricted", encryption_at_rest: "AES-256", status: "active"}

  deployments:
    - {id: "DEP-01", component_id: "CMP-01", environment: "prod", deployment_type: "saas", location_type: "saas", infra_id: "INF-02", runtime_type: "serverless", status: "active"}
    - {id: "DEP-02", component_id: "CMP-02", environment: "prod", deployment_type: "saas", location_type: "saas", infra_id: "INF-02", runtime_type: "serverless", status: "active"}
    - {id: "DEP-03", component_id: "CMP-03", environment: "prod", deployment_type: "saas", location_type: "saas", infra_id: "INF-02", runtime_type: "serverless", status: "active"}
    - {id: "DEP-04", component_id: "CMP-04", environment: "prod", deployment_type: "private_cloud", location_type: "data_center", infra_id: "INF-07", runtime_type: "vm", instance_count: 2, status: "active"}
    - {id: "DEP-05", component_id: "CMP-05", environment: "prod", deployment_type: "private_cloud", location_type: "data_center", infra_id: "INF-09", runtime_type: "container", runtime_detail: "Internal K8s", instance_count: 2, status: "active"}
    - {id: "DEP-06", component_id: "CMP-06", environment: "prod", deployment_type: "private_cloud", location_type: "data_center", infra_id: "INF-09", runtime_type: "physical", instance_count: 1, status: "active"}

  # Flows are component-to-component calls (service authentication only): the
  # user sign-in is declared in `auth`, the vault appears on the component's
  # key_management field, and the firewall hop sits in `via`.
  flows:
    - {id: "FLOW-01", source_component_id: "CMP-01", target_component_id: "CMP-02", protocol: "HTTPS", port: "443", auth_method: "none", encryption: "TLS1.3", cross_border: false, notes: "App triggers the flow with the signed-in user's context"}
    - {id: "FLOW-02", source_component_id: "CMP-02", target_component_id: "CMP-03", protocol: "HTTPS", port: "443", auth_method: "OAuth2_ClientCredentials", encryption: "TLS1.3", cross_border: false, notes: "Approval state only; no restricted data in Dataverse"}
    - {id: "FLOW-03", source_component_id: "CMP-02", target_component_id: "CMP-04", protocol: "HTTPS", port: "443", auth_method: "UserPassword", encryption: "TLS1.2", cross_border: false, notes: "Gateway relay; scoped service account from the vault"}
    - {id: "FLOW-04", source_component_id: "CMP-04", target_component_id: "CMP-06", protocol: "JDBC", port: "1433", auth_method: "UserPassword", encryption: "TLS1.2", cross_border: false, via: ["INF-08"], notes: "Least-privilege account; only client of this schema"}

  network_links:
    - {id: "LNK-01", source_infra_id: "INF-01", target_infra_id: "INF-07", method: "internet", encrypted: true, encryption_method: "TLS 1.2 relay only", managed_by: "Microsoft / InfraSec", redundancy: "primary", notes: "Outbound-only relay from the tenant; no inbound listener and no private circuit"}

  auth:
    - {id: "AUTH-01", subject: "user", applies_to: "CMP-01", auth_server: "INF-04", protocol: "OIDC", authorization: "RBAC", mfa: true, notes: "Conditional access; privileged roles via PIM"}
    - {id: "AUTH-02", subject: "application", applies_to: "CMP-04", auth_server: "INF-04", protocol: "OIDC", authorization: "RBAC", notes: "Gateway service account scoped to the expense schema"}

  credentials:
    - {environment: "private_dc", solution: "Enterprise vault holds and rotates the gateway service account secret"}
    - {environment: "other", solution: "Entra ID app registrations use certificate credentials; no client secrets"}

  constraints:
    - "Power Platform reaches the company network only through the on-premises data gateway"
    - "DLP policy classifies every connector before a business-authored flow may use it"
    - "Acme Restricted data stays in the expense database; Dataverse holds approval state only"

  open_items:
    - {id: "TBD-001", description: "Confirm the environment group and DLP policy export with the Power Platform admin team", owner: "Business Platform", blocking: true}
    - {id: "TBD-002", description: "Confirm the gateway host hardening baseline and its service account scope", owner: "InfraSec", blocking: true}
    - {id: "TBD-003", description: "Confirm retention and sensitivity labels for the Dataverse tables", owner: "Data Platform", blocking: false}
