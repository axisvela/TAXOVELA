# config.yaml — example overlay for service-delivery-private-cloud
#
# SDP spans four private DCs plus Azure-hosted satellite systems, and
# integrates with SAP (RFC), CMP-11, and external 3PL partners.
# Deep-merged on top of the repository-root config.yaml.
# (System codes resolve via input/systems-registry.md.)

datacenters:
  - id: "dc-cn-primary"
    aliases: ["CN Primary DC", "主DC"]
    location: { city: "City A", province: "Province A", country: "CN" }
    model: "three-tier"
    zones: ["DMZ", "Intranet", "DB Zone"]
    region: "APAC-CN"
    notes: "INF-04 ingress, CMP-01..CMP-03 DMZ K8s, CMP-04..CMP-10 Intranet K8s, CMP-12..CMP-19 DB Zone (7 HA groups), INF-03. (See input/systems-registry.md.)"

  - id: "dc-us"
    aliases: ["US DC"]
    location: { city: "City C", state: "State X", country: "US" }
    model: "two-tier"
    zones: ["App Zone", "Intranet"]
    region: "NA"
    notes: "CMP-20, CMP-21, CMP-22, CMP-23, INF-09, INF-10. (See input/systems-registry.md.)"

  - id: "dc-cn-secondary"
    aliases: ["CN Secondary DC", "备DC"]
    location: { city: "City B", province: "Province B", country: "CN" }
    model: "two-tier"
    zones: ["Intranet"]
    region: "APAC-CN"
    notes: "CMP-24, CMP-25, CMP-26, CMP-27, CMP-28. (See input/systems-registry.md.)"

  - id: "dc-cn-support"
    aliases: ["Support DC"]
    location: { city: "City F", country: "CN" }
    model: "two-tier"
    zones: ["App Zone"]
    region: "APAC-CN"
    notes: "CMP-29, CMP-30 support systems. (See input/systems-registry.md.)"

  - id: "azure-global"
    aliases: ["Azure"]
    location: { country: "US" }
    model: "saas"
    zones: ["SaaS apps"]
    region: "NA"
    notes: "CMP-36, CMP-37, CMP-38 and CMP-39 consuming SDP APIs. (See input/systems-registry.md.)"

platforms:
  api_gateway: "WSO2 API Gateway"
  message_bus: "Kafka"
  k8s_platform: "Internal K8s Platform"
  integration_platforms:
    - "WSO2 API Gateway"
    - "Kafka"
    - "MFT platform"
    - "SFTP/MFT"
  auth_internal: "ADFS"
  auth_external: "Enterprise ID"
  authz_platform: "AuthZ Platform"
