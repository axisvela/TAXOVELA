# req-OMS.yaml — req/v2 worked example
# Generated by arch-requirements skill; input file for arch-design skill
# Project: Order Management System (OMS)
#
# Demonstrates the entity separation: F5 and ADFS are infra appliances (INF),
# WSO2 and Kafka are shared-platform components (CMP), ECC is an external system
# (APP) reached through one black-box boundary component, and the ExpressRoute/
# MPLS circuits are links (LNK) rather than nodes.

schema_version: req/v2

requirements:
  project:
    name: "Order Management System"
    id: "OMS-001"
    scope: "standalone"          # standalone | modification | e2e
    department: "SSG / TSD"
    author: "hahxxx1-Huiwen-Han"
    date: "2026-03-23"
    data_classification: "Company Confidential"

  # ── INF-nn — hosting location and network topology ─────────────────────────
  # node_kind = topology role; infra_type = hosting category; network_type =
  # network/security domain. Three independent fields, never one.
  infra:
    - id: "INF-01"
      name: "Neimeng DC (Hohhot)"
      node_kind: "data_center"
      infra_type: "private_cloud"
      network_type: "prod_network"
      country: "CN"
      infra_owner: "InfraSec"
    - id: "INF-02"
      name: "DMZ Zone"
      node_kind: "network_zone"
      infra_type: "private_cloud"
      network_type: "dmz"
      parent_id: "INF-01"
    - id: "INF-03"
      name: "App Zone"
      node_kind: "network_zone"
      infra_type: "private_cloud"
      network_type: "prod_network"
      parent_id: "INF-01"
    - id: "INF-04"
      name: "DB Zone"
      node_kind: "network_zone"
      infra_type: "private_cloud"
      network_type: "prod_network"
      parent_id: "INF-01"
    - id: "INF-05"
      name: "Office Network"
      node_kind: "office_network"
      infra_type: "office"
      network_type: "office_network"
      country: "CN"
    - id: "INF-06"
      name: "Internet"
      node_kind: "internet_network"
      country: "—"
    # L4 appliance nodes — NOT components
    - id: "INF-07"
      name: "F5 BigIP"
      node_kind: "load_balancer"
      infra_type: "private_cloud"
      network_type: "dmz"
      parent_id: "INF-02"
      vendor: "F5"
    - id: "INF-08"
      name: "ADFS"
      node_kind: "identity_provider"
      infra_type: "private_cloud"
      network_type: "prod_network"
      parent_id: "INF-03"
      vendor: "Microsoft"
    - id: "INF-09"
      name: "Internal K8s Secret Store"
      node_kind: "key_management"
      infra_type: "private_cloud"
      network_type: "prod_network"
      parent_id: "INF-03"

  # ── APP-nn — applications and systems ──────────────────────────────────────
  systems:
    - id: "APP-01"
      name: "Order Management System"
      type: "new"
      owner: "org_it"
      data_classification: "Company Confidential"
    - id: "APP-02"
      name: "Integration Platform"
      type: "existing"
      owner: "org_it"
      lifecycle_status: "active"
    - id: "APP-03"
      name: "Messaging Platform"
      type: "existing"
      owner: "org_it"
      lifecycle_status: "active"
    - id: "APP-04"
      name: "ECC (SAP)"
      type: "existing"
      owner: "third_party"
      vendor: "SAP"
      data_classification: "Company Confidential"

  # ── CMP-nn — components and services (never an appliance) ──────────────────
  components:
    - id: "CMP-01"
      system_id: "APP-01"
      subsystem: "web"
      name: "OMS Web"
      kind: "component"
      layer: "fe"
      component_role: "web_frontend"
      sensitivity: "Company Internal"
    - id: "CMP-02"
      system_id: "APP-01"
      subsystem: "bff"
      name: "OMS BFF"
      kind: "service"
      layer: "bff"
      component_role: "bff"
      sensitivity: "Company Confidential"
    - id: "CMP-03"
      system_id: "APP-01"
      subsystem: "order"
      name: "OMS Order Service"
      kind: "service"
      layer: "be"
      component_role: "backend_service"
      sensitivity: "Company Confidential"
    - id: "CMP-04"
      system_id: "APP-01"
      subsystem: "payment"
      name: "OMS Payment Service"
      kind: "service"
      layer: "be"
      component_role: "backend_service"
      encryption_at_rest: "AES-256"
      sensitivity: "Company Restricted"
    - id: "CMP-05"
      system_id: "APP-01"
      subsystem: "data"
      name: "PostgreSQL (OMS DB)"
      kind: "component"
      layer: "db"
      component_role: "database"
      encryption_at_rest: "AES-256 (TDE)"
      key_management: "INF-09"
      sensitivity: "Company Confidential"
    - id: "CMP-06"
      system_id: "APP-02"
      name: "WSO2 API Gateway"
      kind: "component"
      layer: "ip"
      component_role: "api_gateway"
      sensitivity: "Company Internal"
    - id: "CMP-07"
      system_id: "APP-03"
      name: "Kafka"
      kind: "component"
      layer: "mq"
      component_role: "message_bus"
      sensitivity: "Company Confidential"
    # Black-box boundary component for an existing external system
    - id: "CMP-08"
      system_id: "APP-04"
      name: "ECC RFC Interface"
      kind: "component"
      layer: "ip"
      component_role: "integration_service"
      sensitivity: "Company Confidential"

  # ── STK-nn — component -> technology stack ─────────────────────────────────
  stacks:
    - id: "STK-01"
      component_id: "CMP-01"
      component: "Vue"
      version: "3.4.0"
      category: "Framework"
      license: "MIT"
      standard_flag: true
    - id: "STK-02"
      component_id: "CMP-02"
      component: "Spring Boot"
      version: "3.5.0"
      category: "Framework"
      license: "Apache-2.0"
      standard_flag: true
    - id: "STK-03"
      component_id: "CMP-02"
      component: "Java"
      version: "17.0.0"
      category: "Runtime"
      standard_flag: true
    - id: "STK-04"
      component_id: "CMP-05"
      component: "PostgreSQL"
      component_package: "postgresql"
      version: "16.0.0"
      category: "Database"
      eol_date: "2028-11-09"
      license: "PostgreSQL"
      standard_flag: true

  # ── DEP-nn — component runtime placement (references INF, never copies) ─────
  deployments:
    - id: "DEP-01"
      component_id: "CMP-01"
      environment: "prod"
      deployment_type: "private_cloud"
      location_type: "data_center"
      infra_id: "INF-02"
      runtime_type: "container"
      runtime_detail: "Internal K8s"
      instance_count: 2
    - id: "DEP-02"
      component_id: "CMP-02"
      environment: "prod"
      deployment_type: "private_cloud"
      location_type: "data_center"
      infra_id: "INF-03"
      runtime_type: "container"
      runtime_detail: "Internal K8s"
      instance_count: 2
    - id: "DEP-03"
      component_id: "CMP-03"
      environment: "prod"
      deployment_type: "private_cloud"
      location_type: "data_center"
      infra_id: "INF-03"
      runtime_type: "container"
      runtime_detail: "Internal K8s"
      instance_count: 2
    - id: "DEP-04"
      component_id: "CMP-04"
      environment: "prod"
      deployment_type: "private_cloud"
      location_type: "data_center"
      infra_id: "INF-03"
      runtime_type: "container"
      runtime_detail: "Internal K8s"
      instance_count: 2
    - id: "DEP-05"
      component_id: "CMP-05"
      environment: "prod"
      deployment_type: "private_cloud"
      location_type: "data_center"
      infra_id: "INF-04"
      runtime_type: "vm"
      instance_count: 1
    - id: "DEP-06"
      component_id: "CMP-06"
      environment: "prod"
      deployment_type: "private_cloud"
      location_type: "data_center"
      infra_id: "INF-02"
      runtime_type: "container"
      instance_count: 2
    - id: "DEP-07"
      component_id: "CMP-07"
      environment: "prod"
      deployment_type: "private_cloud"
      location_type: "data_center"
      infra_id: "INF-03"
      runtime_type: "container"
      instance_count: 3

  # ── FLOW-nn — directed component communication (service-to-service auth is
  #    inline; an identity-provider redirect is an auth row, not a flow) ───────
  flows:
    - id: "FLOW-01"
      source_component_id: "internet"
      target_component_id: "CMP-01"
      protocol: "HTTPS"
      port: "443"
      auth_method: "none"
      encryption: "TLS1.3"
      cross_border: false
      via: ["INF-07"]
      notes: "TLS terminated at F5; user auth = AUTH-01"
    - id: "FLOW-02"
      source_component_id: "CMP-01"
      target_component_id: "CMP-02"
      protocol: "HTTPS"
      port: "443"
      auth_method: "none"
      encryption: "TLS1.3"
      cross_border: false
      notes: "forwards the ADFS session token"
    - id: "FLOW-03"
      source_component_id: "CMP-02"
      target_component_id: "CMP-06"
      protocol: "HTTPS"
      port: "443"
      auth_method: "OAuth2_ClientCredentials"
      encryption: "TLS1.3"
      cross_border: false
      notes: "all cross-app calls via WSO2"
    - id: "FLOW-04"
      source_component_id: "CMP-06"
      target_component_id: "CMP-03"
      protocol: "HTTPS"
      port: "8080"
      auth_method: "OAuth2_ClientCredentials"
      encryption: "TLS1.3"
      cross_border: false
    - id: "FLOW-05"
      source_component_id: "CMP-06"
      target_component_id: "CMP-04"
      protocol: "HTTPS"
      port: "8081"
      auth_method: "OAuth2_ClientCredentials"
      encryption: "TLS1.3"
      cross_border: false
    - id: "FLOW-06"
      source_component_id: "CMP-06"
      target_component_id: "CMP-08"
      protocol: "TCP/RFC"
      port: "3300"
      auth_method: "Kerberos"
      encryption: "TLS1.3"
      cross_border: false
      notes: "SAP Logon Ticket (ticket-based SSO) — closest enum value; see TBD-04"
    - id: "FLOW-07"
      source_component_id: "CMP-03"
      target_component_id: "CMP-07"
      protocol: "Kafka"
      port: "9093"
      auth_method: "SASL_SCRAM"
      encryption: "TLS1.3"
      cross_border: false
      notes: "publish order events"
    - id: "FLOW-08"
      source_component_id: "CMP-03"
      target_component_id: "CMP-05"
      protocol: "JDBC"
      port: "5432"
      auth_method: "UserPassword"
      encryption: "TLS1.3"
      cross_border: false
      notes: "password from K8s Secret"
    - id: "FLOW-09"
      source_component_id: "CMP-04"
      target_component_id: "CMP-05"
      protocol: "JDBC"
      port: "5432"
      auth_method: "UserPassword"
      encryption: "TLS1.3"
      cross_border: false
      notes: "password from K8s Secret"

  # ── LNK-nn — undirected infra-to-infra network connections ─────────────────
  network_links:
    - id: "LNK-01"
      source_infra_id: "INF-05"
      target_infra_id: "INF-01"
      method: "mpls"
      encrypted: true
      encryption_method: "IPSec"
      managed_by: "InfraSec"
      redundancy: "primary"
    - id: "LNK-02"
      source_infra_id: "INF-06"
      target_infra_id: "INF-01"
      method: "internet"
      encrypted: false
      managed_by: "InfraSec"
      redundancy: "primary"
      notes: "no network-layer encryption; TLS is terminated at INF-07 F5"

  # ── AUTH-nn — user / entry authentication ONLY ─────────────────────────────
  auth:
    - id: "AUTH-01"
      subject: "user"
      applies_to: "CMP-01"
      auth_server: "INF-08"
      protocol: "SAML2"
      authorization: "RBAC"
      authorization_platform: "AuthZ Platform"
      user_roles:
        - "Company SSG Employees (PRC)"
        - "BU Managers"
      notes: "internal user SSO via ADFS"

  # ── APP-nn <-> APP-nn ecosystem relations ──────────────────────────────────
  ecosystem_relations:
    - id: "ECO-01"
      source_system_id: "APP-01"
      target_system_id: "APP-02"
      relation_type: "downstream"
      notes: "OMS consumes Integration Platform APIs"
    - id: "ECO-02"
      source_system_id: "APP-01"
      target_system_id: "APP-04"
      relation_type: "downstream"
      notes: "OMS raises RFC calls to ECC"

  credentials:
    - environment: "private_dc"
      solution: "Kubernetes Secrets (encrypted at rest)"
      notes: "DB passwords, OAuth client secrets"
    - environment: "private_dc"
      solution: "Internal K8s Secret"
      notes: "additional encryption for Restricted payment data"

  constraints:
    - "All data must remain in China (Neimeng DC). No cross-border transfer."
    - "All inter-application communication must go through WSO2 API Gateway."
    - "Runtime must be Internal K8s — no direct VM deployment for new services."
    - "No hardcoded credentials anywhere."
    - "TLS 1.3 minimum for all in-transit communication."
    - "Payment Service classified Company Restricted — AES-256 at rest mandatory."

  open_items:
    - id: "TBD-01"
      description: "Exact Kafka topic names and partition count"
      owner: "InfraSec Platform Team"
      blocking: false
    - id: "TBD-02"
      description: "WSO2 API registration process and timeline"
      owner: "InfraSec Integration Team"
      blocking: false
    - id: "TBD-03"
      description: "PostgreSQL VM specifications (CPU/memory)"
      owner: "InfraSec Infra"
      blocking: false
    - id: "TBD-04"
      description: >
        Confirm whether the SAP Logon Ticket should stay mapped to the Kerberos
        enum value or require a dedicated flow auth_method value.
      owner: "Security Architecture"
      blocking: false
