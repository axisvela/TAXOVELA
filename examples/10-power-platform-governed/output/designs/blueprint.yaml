_design:
  template: "power-platform"
  decisions:
    - choice: "The Power Platform tenant is drawn as a boundary container, its environments as zones"
      rationale: "The tenant is not a customer network; drawing DMZ/App/DB zones inside it would invent control points that do not exist."
    - choice: "Every call into the company network lands on the on-premises data gateway in the DMZ"
      rationale: "The gateway is the only inspected, logged, and revocable path; opening a database port would bypass it."
    - choice: "DLP policy is modelled as a first-class node in the governance zone"
      rationale: "Connector classification is what stops a business-authored flow from moving restricted data to an unapproved connector."
    - choice: "The gateway host reaches the database directly, the API service is not in that path"
      rationale: "The flow needs table-level access to a legacy schema; the gateway uses a least-privilege account rather than widening the API."
  open_implementation_checks:
    - "Confirm the environment group and DLP policy export with the Power Platform admin team."
    - "Confirm the gateway host hardening baseline and its service account scope."
    - "Confirm retention and sensitivity labels for the Dataverse tables."

arch:
  id: "PPGOV-001-TechDiagram-V1.0"
  name: "Expense Approval App (EXP) - Governed Power Platform with On-Premises Backend"
  platform: "hybrid_cloud"
  version: "V1.0"
  author: "TBD"
  owner_team: "Business Platform"
  last_modified: "2026-09-24"

  deployment:

    # ── Power Platform tenant (SaaS — not Company managed) ───────
    - id: "power-platform-tenant"
      type: "power_platform"
      role: "production"
      location: "Power Platform tenant (Acme) [SG/HK]"
      owner: "Microsoft"
      subnets:
        - id: "pp-prod-env"
          type: "private"
          name: "Production environment (Managed)"
          components:
            - id: "CMP-01"
              name: "CMP-01 | Expense approval app"
              type: "FE"
              framework: "Power Apps canvas app"
              runtime: "Power Platform managed environment"
              sensitivity: "Acme Confidential"
              owner_type: "biz_owned"
              status: "newly_created"
              notes: "Business-authored app; only standard connectors are allowed."

            - id: "CMP-02"
              name: "CMP-02 | Approval flow"
              type: "BE"
              framework: "Power Automate"
              runtime: "Power Platform managed environment"
              sensitivity: "Acme Confidential"
              owner_type: "biz_owned"
              status: "newly_created"
              notes: "Submits the request to the company backend through the gateway."

            - id: "CMP-03"
              name: "CMP-03 | Dataverse table"
              type: "DB"
              shape: "cylinder"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Environment-scoped store for approval state only; no restricted data."

        - id: "pp-governance"
          type: "private"
          name: "Governance and identity"
          components:
            - id: "INF-04"
              name: "INF-04 | Entra ID"
              type: "SEC"
              shape: "circle"
              node_kind: "identity_provider"
              runtime: "Microsoft Entra ID"
              owner_type: "org_it"
              status: "unchanged"
              notes: "Only identity source; conditional access and PIM for privileged roles."

            - id: "INF-05"
              name: "INF-05 | DLP policy"
              type: "SEC"
              shape: "hexagon"
              node_kind: "policy_service"
              runtime: "Power Platform admin center"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Connector classification: Business / Non-Business / Blocked, applied by environment group."

    # ── Company private DC ───────────────────────────────────────
    - id: "dc-primary"
      type: "private_dc"
      role: "production"
      location: "Primary DC [CN]"
      owner: "InfraSec"
      network_zones:
        - id: "dc-dmz"
          type: "dmz"
          name: "DMZ"
          components:
            - id: "INF-08"
              name: "INF-08 | Boundary firewall"
              type: "SEC"
              shape: "hexagon"
              role: "zone_boundary"
              runtime: "Network appliance"
              owner_type: "org_it"
              status: "unchanged"
              notes: "All inbound traffic terminates here; the gateway is the only permitted destination."

            - id: "CMP-04"
              name: "CMP-04 | On-premises data gateway"
              type: "IP"
              shape: "parallelogram"
              runtime: "Hardened Windows host"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "newly_created"
              notes: "Sole ingress from Power Platform; outbound-only relay, service account scoped to one database."

        - id: "dc-app-zone"
          type: "app_zone"
          name: "App Zone"
          components:
            - id: "CMP-05"
              name: "CMP-05 | Expense service"
              type: "BE"
              language: "Java-17"
              framework: "Spring Boot-3.5.2"
              runtime: "Internal K8s Platform"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "unchanged"
              notes: "Company API for expense data; not in the gateway's direct path."

            - id: "CMP-06"
              name: "CMP-06 | Expense database"
              type: "DB"
              shape: "cylinder"
              sensitivity: "Acme Restricted"
              encryption_at_rest: "AES-256"
              owner_type: "org_it"
              status: "unchanged"
              notes: "Read and written by the gateway's service account only."

            - id: "INF-10"
              name: "INF-10 | Enterprise vault"
              type: "SEC"
              shape: "circle"
              node_kind: "key_management"
              runtime: "Enterprise vault with HSM"
              owner_type: "org_it"
              status: "unchanged"
              notes: "Holds the gateway service account secret and rotates it."

  interactions:
    - from: "user"
      to: "CMP-01"
      protocol: "HTTPS/TLS 1.3"
      auth: "OIDC"
      encryption: "TLS1.3"
      notes: "Business user signs in through Entra ID with MFA and conditional access."

    - from: "CMP-01"
      to: "CMP-02"
      protocol: "HTTPS/TLS 1.3"
      auth: "OAuth2.0 User Token"
      encryption: "TLS1.3"
      notes: "App triggers the flow with the signed-in user's context."

    - from: "CMP-02"
      to: "CMP-03"
      protocol: "HTTPS/Dataverse API"
      auth: "OAuth2.0 Client Credentials"
      encryption: "TLS1.3"
      notes: "Approval state only; no restricted data in Dataverse."

    - from: "CMP-02"
      to: "CMP-04"
      protocol: "HTTPS/TLS 1.2"
      auth: "UserPassword"
      encryption: "TLS1.2"
      notes: "Gateway relay; the credential is a scoped service account from the enterprise vault."

    - from: "CMP-04"
      to: "CMP-06"
      protocol: "JDBC/SQLServer"
      auth: "UserPassword"
      encryption: "TLS1.2"
      notes: "Least-privilege account; no other client may reach this schema."

    - from: "CMP-04"
      to: "INF-10"
      protocol: "HTTPS/TLS 1.3"
      auth: "ClientCertificate"
      encryption: "TLS1.3"
      notes: "Secret retrieval at start-up and on rotation."

    - from: "INF-04"
      to: "CMP-01"
      protocol: "HTTPS/OIDC"
      auth: "OIDC"
      encryption: "TLS1.3"
      notes: "Token issuance and verification for the app and the flow."

  security:
    key_management:
      private_dc: "Enterprise vault holds and rotates the gateway service account secret"
      other: "Entra ID app registrations use certificate credentials; no client secrets"
    user_auth_internal:
      server: "INF-04 | Entra ID"
      protocol: "OIDC with MFA and conditional access"
    network_segmentation:
      ingress: "Power Platform reaches only the on-premises data gateway; the boundary firewall drops everything else"
      external: "The gateway relay is outbound-only from the tenant's perspective; no inbound listener is exposed"
      database: "Expense database accepts connections from the gateway host only"
      east_west: "App and flow stay inside the managed environment; Dataverse is environment-scoped"
    data_protection:
      in_transit: "TLS 1.3 preferred; TLS 1.2 minimum on the gateway relay"
      at_rest: "Dataverse is Microsoft-managed; the expense database is AES-256 with vault-held keys"
      classification: "Acme Restricted data stays in the expense database; Dataverse holds approval state only"
    monitoring:
      centralized: "Power Platform audit logs and gateway logs export to the enterprise SIEM"
