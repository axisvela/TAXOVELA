[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archharness"
dynamic = ["version"]
description = "Enterprise architecture skill pack and multi-project workspace tools"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6,<7"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/axisrobo/ea-harness"
Repository = "https://github.com/axisrobo/ea-harness"
Releases = "https://github.com/axisrobo/ea-harness/releases"
Documentation = "https://github.com/axisrobo/ea-harness#readme"

[project.optional-dependencies]
diagram = ["matplotlib>=3.7"]
documents = ["pdfplumber>=0.10", "python-docx>=1.1"]
llm = ["anthropic>=0.40", "openai>=1.0"]
all = ["matplotlib>=3.7", "pdfplumber>=0.10", "python-docx>=1.1", "anthropic>=0.40", "openai>=1.0"]

[project.scripts]
archharness = "archharness.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["archharness*"]

[tool.setuptools.dynamic]
version = {attr = "archharness.__version__"}
