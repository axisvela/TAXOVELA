_design:
  stage: design
  project_id: ECOM-AZ-001
  requirements_source: output/requirements/req.yaml
  registry_source: input/systems-registry.md
  templates: [azure-hub-spoke]
  decisions:
    - {decision: "Appliance policy", choice: "INF-06/08 firewalls and INF-10 WAF are L4 infra", rationale: "Security devices are not components."}
    - {decision: "Runtime policy", choice: "AKS only appears as deployment runtime", rationale: "Kubernetes is not an inventory node."}
    - {decision: "Carrier policy", choice: "Dedicated circuits and backup WAN are LNK rows", rationale: "Carrier paths are links, not nodes."}
arch:
  id: ECOM-AZ-001-TechDiagram-V2.0
  name: E-commerce Platform - Azure Multi-Region Hub-Spoke Architecture
  platform: azure
  version: V2.0
  author: OpenCode
  owner_team: TBD
  last_modified: 2026-09-24
  deployment:
    - id: INF-01
      type: azure_vnet
      role: production
      location: Azure East US [US]
      owner: InfraSec
      subnets:
        - id: eus-firewall-zone
          type: hub
          name: East US inspection
          components:
            - {id: INF-06, name: "INF-06 East US firewall", type: SEC, shape: hexagon, runtime: "Azure managed service", owner_type: org_it, status: newly_created}
            - {id: INF-07, name: "INF-07 East US hybrid gateway", type: NW, runtime: "Azure managed service", owner_type: org_it, status: newly_created}
    - id: INF-02
      type: azure_vnet
      role: production
      location: Azure East US [US]
      owner: Business IT
      subnets:
        - id: INF-22
          type: public
          name: East US ingress
          components:
            - {id: INF-10, name: "INF-10 Application Gateway WAF", type: SEC, shape: hexagon, runtime: "Azure Application Gateway WAF v2", owner_type: org_it, status: newly_created}
        - id: INF-11
          type: private
          name: East US business runtime
          components:
            - {id: CMP-01, name: "CMP-01 US container workload", type: BE, runtime: AKS, owner_type: biz_owned, status: newly_created}
        - id: INF-12
          type: private
          name: East US business application
          components:
            - {id: CMP-02, name: "CMP-02 US VM application", type: BE, runtime: "Azure VMs", owner_type: biz_owned, status: newly_created}
        - id: INF-13
          type: private
          name: East US business database
          components:
            - {id: CMP-03, name: "CMP-03 US database", type: DB, shape: cylinder, owner_type: biz_owned, status: newly_created}
    - id: INF-03
      type: azure_vnet
      role: production
      location: Azure East US [US]
      owner: InfraSec
      subnets:
        - id: INF-14
          type: private
          name: East US shared runtime
          components:
            - {id: CMP-04, name: "CMP-04 shared container workload", type: BE, runtime: AKS, owner_type: org_it, status: newly_created}
        - id: INF-15
          type: private
          name: East US shared services
          components:
            - {id: CMP-05, name: "CMP-05 shared services", type: BE, owner_type: org_it, status: newly_created}
        - id: INF-16
          type: private
          name: East US storage endpoint
          components:
            - {id: CMP-06, name: "CMP-06 object storage", type: DS, shape: cloud_rect, runtime: "Azure private endpoint", owner_type: org_it, status: newly_created}
    - id: INF-04
      type: azure_vnet
      role: production
      location: Azure Japan East [JP]
      owner: InfraSec
      subnets:
        - id: jpe-firewall-zone
          type: hub
          name: Japan East inspection
          components:
            - {id: INF-08, name: "INF-08 Japan East firewall", type: SEC, shape: hexagon, runtime: "Azure managed service", owner_type: org_it, status: newly_created}
            - {id: INF-09, name: "INF-09 Japan East hybrid gateway", type: NW, runtime: "Azure managed service", owner_type: org_it, status: newly_created}
    - id: INF-05
      type: azure_vnet
      role: production
      location: Azure Japan East [JP]
      owner: Business IT
      subnets:
        - id: INF-17
          type: private
          name: Japan East runtime
          components:
            - {id: CMP-07, name: "CMP-07 AP container workload", type: BE, runtime: AKS, owner_type: biz_owned, status: newly_created}
        - id: INF-18
          type: private
          name: Japan East application
          components:
            - {id: CMP-08, name: "CMP-08 AP VM application", type: BE, runtime: "Azure VMs", owner_type: biz_owned, status: newly_created}
        - id: INF-19
          type: private
          name: Japan East database
          components:
            - {id: CMP-09, name: "CMP-09 AP database", type: DB, shape: cylinder, owner_type: biz_owned, status: newly_created}
    - id: INF-20
      type: private_dc
      role: production
      location: US corporate DC [US]
      owner: Corporate IT
      network_zones:
        - id: us-boundary-zone
          type: app_zone
          name: US integration boundary
          components:
            - {id: CMP-10, name: "CMP-10 US corporate boundary", type: IP, shape: parallelogram, owner_type: org_it, status: unchanged}
    - id: INF-21
      type: private_dc
      role: production
      location: Japan corporate DC [JP]
      owner: Corporate IT
      network_zones:
        - id: jp-boundary-zone
          type: app_zone
          name: Japan integration boundary
          components:
            - {id: CMP-11, name: "CMP-11 Japan corporate boundary", type: IP, shape: parallelogram, owner_type: org_it, status: unchanged}
  interactions:
    - {from: internet, to: INF-10, protocol: "HTTPS; 443", auth: OIDC, encryption: TLS1.3, notes: "AUTH-01 customer entry"}
    - {from: INF-10, to: CMP-01, protocol: "HTTPS; 443", auth: OAuth2_AuthorizationCode, encryption: TLS1.3, notes: "WAF-protected AKS route"}
    - {from: INF-10, to: CMP-02, protocol: "HTTPS; 443", auth: OAuth2_AuthorizationCode, encryption: TLS1.3, notes: "WAF-protected VM route"}
    - {from: CMP-01, to: INF-06, protocol: "TCP; TBD", auth: ManagedIdentity, encryption: TLS1.3, notes: "FLOW-03 inspection"}
    - {from: INF-06, to: CMP-03, protocol: "TCP; TBD", auth: ManagedIdentity, encryption: TLS1.3, notes: "US database"}
    - {from: CMP-02, to: CMP-03, protocol: "TCP; TBD", auth: ManagedIdentity, encryption: TLS1.3, notes: "US database"}
    - {from: CMP-01, to: CMP-05, protocol: "HTTPS; 443", auth: OAuth2_ClientCredentials, encryption: TLS1.3, notes: "FLOW-05 via INF-06"}
    - {from: CMP-04, to: CMP-05, protocol: "HTTPS; 443", auth: OAuth2_ClientCredentials, encryption: TLS1.3, notes: "Shared service"}
    - {from: CMP-05, to: CMP-06, protocol: "HTTPS; 443", auth: ManagedIdentity, encryption: TLS1.3, notes: "Private endpoint"}
    - {from: CMP-07, to: INF-08, protocol: "TCP; TBD", auth: ManagedIdentity, encryption: TLS1.3, notes: "FLOW-08 inspection"}
    - {from: INF-08, to: CMP-09, protocol: "TCP; TBD", auth: ManagedIdentity, encryption: TLS1.3, notes: "AP database"}
    - {from: CMP-08, to: CMP-09, protocol: "TCP; TBD", auth: ManagedIdentity, encryption: TLS1.3, notes: "AP database"}
    - {from: CMP-10, to: INF-07, protocol: ExpressRoute, auth: "IKEv2 certificate", encryption: "IPsec AES-256", notes: "LNK-04 through LNK-07"}
    - {from: INF-07, to: INF-06, protocol: "Hub transit", auth: "Firewall policy", encryption: TLS1.3, notes: "Inspected US hybrid route"}
    - {from: INF-06, to: CMP-05, protocol: "HTTPS; 443", auth: OAuth2_ClientCredentials, encryption: TLS1.3, notes: "FLOW-10"}
    - {from: CMP-11, to: INF-09, protocol: ExpressRoute, auth: "IKEv2 certificate", encryption: "IPsec AES-256", notes: LNK-08}
    - {from: INF-09, to: INF-08, protocol: "Hub transit", auth: "Firewall policy", encryption: TLS1.3, notes: "Inspected Japan hybrid route"}
    - {from: INF-08, to: CMP-07, protocol: "HTTPS; 443", auth: OAuth2_ClientCredentials, encryption: TLS1.3, notes: FLOW-11}
  security:
    key_management: {azure: "Azure Key Vault and managed identities; no hardcoded credentials"}
    authorization: {platform: "Azure RBAC", enforcement: "Managed identity and firewall policy"}
    data_protection: {in_transit: "TLS 1.3 on application traffic; IPsec on hybrid paths", at_rest: "Azure platform encryption; database configuration TBD"}
