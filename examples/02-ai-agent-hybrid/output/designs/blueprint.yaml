_design:
  stage: "design"
  project_id: "DAP-001"
  requirements_source: "output/requirements/req.yaml"
  registry_source: "input/systems-registry.md"
  templates:
    - "private-cloud"
    - "azure-hub-spoke"
    - "data-analytics"
  decisions:
    - decision: "Deployment pattern"
      choice: "Private DC application runtime with Azure private service boundaries"
      rationale: "The agent runtime and PostgreSQL data remain in China while EDW and model services are consumed from their declared Azure regions."
    - decision: "Private DC topology"
      choice: "Three-tier DC with DMZ, Internal K8s App Zone, and DB Zone"
      rationale: "This follows the configured dc-cn-primary model without inventing an unresolved ingress product or address."
    - decision: "Cloud connectivity"
      choice: "Controlled private connectivity through CMP-05 Outbound gateway"
      rationale: "CMP-05 is the sole application egress path; the carrier, routing, private DNS, and firewall implementation remain TBD."
    - decision: "Identity"
      choice: "INF-07 Microsoft Entra ID primary; INF-05 ADFS fallback"
      rationale: "Both identity boundaries are required, while the Entra sign-in protocol and authorization mapping remain TBD."
    - decision: "Data and model access"
      choice: "Governed CMP-06 EDW access and private-endpoint-only CMP-07 LLM access"
      rationale: "The design limits data queries to governed namespaces and applies tenant policy to model-pool selection."
  template_rationale: "The private-cloud template supplies the dc-cn-primary three-tier baseline; azure-hub-spoke supplies private hybrid and private-endpoint boundaries; data-analytics supplies the governed EDW data-service pattern. Unrelated Azure application, Power BI, and ETL components are intentionally excluded."
  validation_focus:
    - "Confirm the office-to-CMP-01 publishing, load-balancing, and firewall path before implementation."
    - "Confirm private connectivity, routing, private DNS, and firewall controls between dc-cn-primary and both Azure regions."
    - "Confirm Entra sign-in protocol, token validation, tenant authorization, and ADFS fallback behavior."
    - "Confirm service authentication for INT-03 and INT-06 and credential lifecycle controls for CMP-06 and CMP-07."
    - "Confirm PostgreSQL encryption, certificate trust, backup protection, availability, RTO, and RPO."
    - "Approve cross-border minimization, redaction, logging, retention, and legal controls."

arch:
  id: "DAP-001-TechDiagram-V1.0"
  name: "Data Agent Platform (GDA) - Hybrid Technical Architecture"
  platform: "hybrid_cloud"
  version: "V1.0"
  author: "TBD"
  owner_team: "TBD"
  last_modified: "2026-09-14"

  deployment:
    - id: "dc-cn-primary"
      type: "private_dc"
      role: "production"
      location: "City A, Province A [CN]"
      owner: "TBD"
      network_zones:
        - id: "dc-cn-primary-dmz"
          type: "dmz"
          name: "DMZ - Inbound Path TBD"
          components: []

        - id: "dc-cn-primary-app-zone"
          type: "app_zone"
          name: "Internal K8s / App Zone"
          components:

            - id: "CMP-01"
              name: "CMP-01 gda-gateway"
              type: "FE"
              language: "N/A - static assets and configuration"
              framework: "nginx; version TBD"
              runtime: "Internal K8s Platform"
              sensitivity: "Acme Confidential"
              owner_type: "biz_owned"
              status: "newly_created"
              notes: "Office-network web entry, dashboard, static hosting, API proxy, and authenticated SSE client."

            - id: "CMP-02"
              name: "CMP-02 gda-agent-api"
              type: "BE"
              language: "Node.js; version TBD"
              framework: "TBD"
              runtime: "Internal K8s Platform"
              sensitivity: "Acme Confidential"
              owner_type: "biz_owned"
              status: "newly_created"
              notes: "Agent API, authenticated SSE streaming, and governed data/model tools."

            - id: "CMP-03"
              name: "CMP-03 gda-scheduler-worker"
              type: "BE"
              language: "Node.js; version TBD"
              framework: "TBD"
              runtime: "Internal K8s Platform"
              sensitivity: "Acme Confidential"
              owner_type: "biz_owned"
              status: "newly_created"
              notes: "Background alerts and digest processing."

            - id: "CMP-05"
              name: "CMP-05 Outbound gateway"
              type: "IP"
              shape: "parallelogram"
              language: "N/A - configuration"
              framework: "nginx; version TBD"
              runtime: "Rocky Linux 9.8 VM"
              sensitivity: "Acme Confidential"
              owner_type: "biz_owned"
              status: "newly_created"
              notes: "Sole controlled private-DC application egress path to Azure; allowlisted destinations only."

            - id: "INF-05"
              name: "INF-05 ADFS"
              type: "SEC"
              shape: "circle"
              runtime: "Existing private-DC identity service"
              owner_type: "org_it"
              status: "unchanged"
              notes: "Internal SAML 2.0 STS fallback; fallback trigger and role mapping TBD."

        - id: "dc-cn-primary-db-zone"
          type: "db_zone"
          name: "DB Zone"
          components:
            - id: "CMP-04"
              name: "CMP-04 PostgreSQL"
              type: "DB"
              shape: "cylinder"
              language: "N/A"
              framework: "PostgreSQL; version TBD"
              runtime: "DB Zone hosts/service model TBD"
              sensitivity: "Acme Confidential"
              owner_type: "biz_owned"
              status: "newly_created"
              notes: "App Zone access only; endpoint, HA model, at-rest encryption, backup, RTO, and RPO are TBD."

    - id: "azure-global-identity"
      type: "azure_vnet"
      role: "production"
      location: "Azure Global Service [Location TBD]"
      owner: "Microsoft/TBD"
      subnets:
        - id: "azure-global-identity-zone"
          type: "spoke"
          name: "Cloud Identity Service Boundary"
          components:
            - id: "INF-07"
              name: "INF-07 Microsoft Entra ID"
              type: "SEC"
              shape: "cloud_rect"
              runtime: "Microsoft cloud service"
              owner_type: "third_party"
              status: "unchanged"
              notes: "Primary user identity provider; tenant data location and redirect protocol are TBD."

    - id: "azure-eastus"
      type: "azure_vnet"
      role: "production"
      location: "Azure East US, Virginia [US]"
      owner: "TBD"
      subnets:
        - id: "azure-eastus-hub"
          type: "hub"
          name: "East US Hybrid Connectivity Boundary"
          components:
            - id: "INF-11"
              name: "Private Connectivity Gateway - type TBD"
              type: "NW"
              status: "unchanged"
              notes: "Carrier, routing, firewall, and private DNS implementation are TBD; no public application path."

        - id: "azure-eastus-edw-spoke"
          type: "spoke"
          name: "EDW Data Resource Group / Private Subnet"
          components:
            - id: "CMP-06"
              name: "CMP-06 EDW Databricks"
              type: "DS"
              shape: "cloud_rect"
              runtime: "Azure Databricks"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "unchanged"
              notes: "Existing governed data source; access limited to approved namespaces with row-level governance. Exact resource group and subnet are TBD."

    - id: "azure-eastus2"
      type: "azure_vnet"
      role: "production"
      location: "Azure East US 2, Virginia [US] - Confirmation TBD"
      owner: "TBD"
      subnets:
        - id: "azure-eastus2-hub"
          type: "hub"
          name: "East US 2 Hybrid Connectivity Boundary"
          components:
            - id: "INF-12"
              name: "Private Connectivity Gateway - type TBD"
              type: "NW"
              status: "unchanged"
              notes: "Carrier, routing, firewall, and private DNS implementation are TBD; no public application path."

        - id: "azure-eastus2-private-endpoint"
          type: "private"
          name: "Model Resource Group / Private Endpoint Subnet"
          components:
            - id: "CMP-07"
              name: "CMP-07 LLM Gateway"
              type: "IP"
              shape: "parallelogram"
              runtime: "Azure private service"
              sensitivity: "Acme Confidential"
              owner_type: "org_it"
              status: "unchanged"
              notes: "Private-endpoint-only model gateway; no public exposure; tenant policy selects overseas or China model pool."

  interactions:
    - id: "INT-01"
      from: "user"
      to: "CMP-01"
      protocol: "HTTPS/443"
      auth: "INF-07 Microsoft Entra ID redirect - protocol TBD"
      encryption: "TLS 1.2+"
      notes: "Tenant and platform administrators only; office network only; inbound publishing, load-balancing, and firewall path TBD."

    - id: "INT-02"
      from: "CMP-01"
      to: "CMP-02"
      protocol: "HTTPS/443 + SSE"
      auth: "Forwarded INF-07 user token - format and validation TBD"
      encryption: "TLS 1.2+"
      notes: "Authenticated per-session stream; authorization must preserve tenant isolation."

    - id: "INT-03"
      from: "CMP-01"
      to: "CMP-03"
      protocol: "HTTPS/443"
      auth: "TBD approved internal service authentication"
      encryption: "TLS 1.2+"
      notes: "Cross-workload call inside the Internal K8s / App Zone."

    - id: "INT-04"
      from: "CMP-02"
      to: "CMP-04"
      protocol: "PostgreSQL/TCP/5432"
      auth: "Database username/password from encrypted Internal K8s Kubernetes Secret"
      encryption: "TLS 1.2+ - enforcement and certificate trust TBD"
      notes: "App Zone to DB Zone; least-privilege database role."

    - id: "INT-05"
      from: "CMP-03"
      to: "CMP-04"
      protocol: "PostgreSQL/TCP/5432"
      auth: "Database username/password from encrypted Internal K8s Kubernetes Secret"
      encryption: "TLS 1.2+ - enforcement and certificate trust TBD"
      notes: "App Zone to DB Zone; least-privilege database role."

    - id: "INT-06"
      from: "CMP-02"
      to: "CMP-05"
      protocol: "HTTPS/443"
      auth: "TBD approved internal service authentication"
      encryption: "TLS 1.2+"
      notes: "Mandatory egress hop; network policy prohibits direct Internal K8s pod cloud or internet egress."

    - id: "INT-07"
      from: "CMP-05"
      to: "CMP-06"
      protocol: "HTTPS/443 over private connectivity - type TBD"
      auth: "TBD approved CMP-06 service credential and rotation"
      encryption: "TLS 1.2+"
      notes: "Allowlisted EDW destination; governed namespaces and row-level governance only; China-to-US query payload minimized and logged without payload copies."

    - id: "INT-08"
      from: "CMP-05"
      to: "CMP-07"
      protocol: "HTTPS/443 via private endpoint"
      auth: "API key - approved delivery, storage, access control, and rotation TBD"
      encryption: "TLS 1.2+"
      notes: "Allowlisted private endpoint; public access disabled; prompt/response redaction, retention, and cross-border approval TBD."

    - id: "INT-09"
      from: "CMP-01"
      to: "INF-05"
      protocol: "HTTPS/443 + SAML 2.0"
      auth: "SAML 2.0 federation"
      encryption: "TLS 1.2+"
      notes: "Internal STS fallback; fallback behavior and role mapping TBD."

    - id: "NET-01"
      from: "user"
      to: "INF-07"
      protocol: "HTTPS/443 over controlled enterprise egress"
      auth: "Microsoft Entra ID user authentication - exact protocol TBD"
      encryption: "TLS 1.2+"
      notes: "Browser redirect flow; enterprise egress path and tenant data location TBD."

    - id: "NET-02"
      from: "dc-cn-primary"
      to: "azure-eastus"
      protocol: "Private connectivity - type TBD"
      auth: "Network trust controls TBD"
      encryption: "TLS 1.2+ application encryption"
      notes: "Logical hybrid path for CMP-05 to CMP-06; routing, firewall, private DNS, and carrier controls TBD."

    - id: "NET-03"
      from: "dc-cn-primary"
      to: "azure-eastus2"
      protocol: "Private connectivity - type TBD"
      auth: "Network trust controls TBD"
      encryption: "TLS 1.2+ application encryption"
      notes: "Logical hybrid path for CMP-05 to the CMP-07 private endpoint; routing, firewall, private DNS, and carrier controls TBD."

  security:
    key_management:
      private_dc: "Internal K8s Kubernetes Secrets encrypted at rest for pod credentials; approved CMP-05 VM secret delivery/store TBD; least-privilege RBAC, injection, and rotation required; no hardcoded secrets"
      azure: "Provider-side controls remain outside the integration boundary; CMP-06 credential mechanism and any Azure Key Vault ownership are TBD"
    user_auth_internal:
      server: "INF-05 ADFS"
      protocol: "SAML 2.0 fallback"
    user_auth_external:
      server: "INF-07 Microsoft Entra ID"
      protocol: "Redirect-based federated sign-in - exact protocol TBD"
    authorization:
      platform: "AuthZ Platform - implementation TBD"
      enforcement: "CMP-01 and CMP-02 application-level tenant and role enforcement; role mapping TBD"
    bastion:
      unified: "Privileged Access Workstation (PAW) - implementation confirmation TBD"
      access_path: "Office Network -> PAW -> private management paths; no public SSH/RDP"
    operational_access:
      - "MFA and least privilege are required for privileged access."
      - "No public administrative endpoint is permitted."
      - "CMP-05 permits only approved CMP-06 and CMP-07 destinations."
      - "Internal K8s network policy denies direct pod internet and cloud egress."
    data_protection:
      in_transit: "TLS 1.2 or later on every application interaction; PostgreSQL TLS enforcement and certificate trust TBD"
      at_rest: "Internal K8s secrets encrypted at rest; CMP-04 database and backup encryption method TBD; Azure provider controls TBD"
      cross_border: "Agent runtime, prompt metadata, and CMP-04 data remain in China; only minimized governed query and controlled prompt/response payloads traverse CMP-05 to the United States after legal/compliance approval"
    high_risk_notes:
      - "Cross-border legal basis, minimization, redaction, logging, and retention controls require approval."
      - "Telemetry must not create uncontrolled copies of Acme Confidential payloads."
      - "CMP-07 public network exposure is prohibited."
      - "Product versions, capacity, monitoring, availability, backup, RTO, and RPO remain TBD."
