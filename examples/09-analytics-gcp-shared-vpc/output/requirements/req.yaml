    - {id: "TBD-002", description: "Confirm BigQuery retention and the CMEK rotation period", owner: "Data Platform", blocking: false}
    - {id: "TBD-003", description: "Privacy and Legal must approve the ERP extract scope before production", owner: "Privacy/Legal", blocking: true}
