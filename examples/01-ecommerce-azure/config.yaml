# config.yaml — example overlay for ecommerce-azure
#
# Deep-merged on top of the repository-root config.yaml when commands run
# from this directory (see tools/config_loader.py `find_config_chain`).
# Lists (e.g. datacenters) REPLACE the root list; dict keys merge per-key.

# ──────────────────────────────────────────────────────────
# Network locations for this example.
# The e-commerce platform is 100% Azure (two regions) plus
# hybrid ExpressRoute/MPLS connectivity to two on-prem DCs.
# ──────────────────────────────────────────────────────────
datacenters:
  - id: "azure-eastus"
    aliases: ["Azure EastUS", "EastUS", "E-commerce-US"]
    location: { city: "Virginia", state: "VA", country: "US" }
    model: "hub-spoke"
    zones:
      - "Hub-vNet (CoreService)"
      - "Spoke-BU-vNet"
      - "Spoke-Common-vNet"
    region: "NA"
    notes: "Primary region. INF-01 carries INF-06 + INF-07; INF-02 and INF-03 are peered. (See input/systems-registry.md.)"

  - id: "azure-japaneast"
    aliases: ["Azure JapanEast", "JapanEast", "AP-Prod"]
    location: { city: "Tokyo", country: "JP" }
    model: "hub-spoke"
    zones:
      - "Hub-vNet (CoreService-AP)"
      - "Spoke-AP-vNet"
    region: "APAC-JP"
    notes: "AP region. INF-04 carries INF-08 + INF-09; INF-05 is peered to the hub. (See input/systems-registry.md.)"

  - id: "dc-us"
    aliases: ["US HQ DC", "US East DC"]
    location: { city: "City C", state: "State X", country: "US" }
    model: "multi-zone"
    zones: ["PROD-DMZ-SERVER", "PROD-INA-INTEGRATION", "PROD-INA-DB"]
    region: "NA"
    notes: "INF-20 attaches to INF-01 via LNK-04 + LNK-05 with LNK-06 and LNK-07 as backup. (See input/systems-registry.md.)"

  - id: "dc-jp"
    aliases: ["Japan DC", "JP DC"]
    location: { city: "Osaka", country: "JP" }
    model: "two-tier"
    zones: ["DMZ", "Intranet"]
    region: "APAC-JP"
    notes: "INF-21 attaches to INF-04 via LNK-08. (See input/systems-registry.md.)"

# ──────────────────────────────────────────────────────────
# Platform names used by this example
# ──────────────────────────────────────────────────────────
platforms:
  api_gateway: "Azure API Management"
  message_bus: "Kafka"
  k8s_platform: "AKS"
  integration_platforms:
    - "Azure API Management"
    - "Azure Application Gateway"
    - "Kafka"
    - "ExpressRoute"
  auth_internal: "ADFS"
  auth_external: "Microsoft Entra ID"
  authz_platform: "AuthZ Platform"
