_design:
  template_selection: "aws-hybrid + private-cloud"
  decisions:
    - decision: "Deployment pattern"
      choice: "AWS N. Virginia three-tier VPC with private-DC integration regions"
      rationale: "The new OQP ROW workload is hosted on AWS while identity, API mediation, Kafka, and source systems remain distributed across US and PRC private DCs."
    - decision: "Application runtime"
      choice: "SYS-58 Internal K8s Platform"
      rationale: "Requirements place SYS-05 in the frontend cluster and SYS-06 through SYS-23 in the backend cluster; SYS-24 remains beside that cluster."
    - decision: "Cross-system integration"
      choice: "SYS-29/SYS-30/SYS-31 API hubs and SYS-32 through SYS-36 Kafka"
      rationale: "Direct cross-system calls are prohibited; every source is shown at an approved mediation boundary. Exact API and topic mappings remain TBD-05."
    - decision: "Identity and authorization"
      choice: "SYS-01 ADFS, SYS-02 Enterprise ID, and AuthZ Platform RBAC"
      rationale: "Separate internal and partner SSO paths are required, with authorization enforced at gateway and application layers."
    - decision: "Data residency"
      choice: "PRC rows remain in China"
      rationale: "SYS-57 is accessed through the in-country SYS-34 boundary; only requests and approved non-row responses may traverse to AWS."
  template_rationale: "The aws-hybrid template supplies the AWS/private-DC pattern and AWS security baseline. The private-cloud template supplies explicit multi-DC zones, integration-platform shapes, and private-DC security conventions. Azure is represented only as existing source boundaries, not as an application deployment tier."
  validation_focus:
    - "Confirm every cross-system flow terminates at an approved API or Kafka mediation component."
    - "Confirm AWS public, application, and database tiers remain separated by boundary controls."
    - "Confirm PRC row payloads never traverse a cross-border interaction."
    - "Resolve TBD-04 ports and TBD-05 source/topic mappings before implementation."

