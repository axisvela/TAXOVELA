# config.yaml — example overlay for order-query-aws-hybrid
#
# OVP ROW runs on AWS US (three-tier subnet model mirroring the private-DC
# standard) and integrates with four private DCs plus Azure data sources.
# Every cross-system call is mediated by APIM/APIH or a Kafka cluster.

datacenters:
  - id: "aws-us"
    aliases: ["AWS US", "AWS US VPC"]
    location: { city: "N. Virginia", state: "VA", country: "US" }
    model: "three-tier-subnets"
    zones: ["Public subnet (DMZ)", "Private subnet (App Zone)", "Private subnet (DB Zone)"]
    region: "NA"
    notes: "VPC hosts APP-01; INF-02 through INF-04 mirror the private-cloud three-tier model."

  - id: "dc-us"
    aliases: ["US DC", "US East DC"]
    location: { city: "City C", state: "State X", country: "US" }
    model: "three-tier"
    zones: ["Public subnet (DMZ)", "App Zone", "DB Zone"]
    region: "NA"
    notes: "Identity hub: INF-12 + INF-13; CMP-54 portal; CMP-25; CMP-28 Kafka. (See input/systems-registry.md.)"

  - id: "dc-us-na"
    aliases: ["NA DC", "NA-DC"]
    location: { city: "City C", state: "State X", country: "US" }
    model: "multi-zone"
    zones: ["NA-PROD-INA-INTEGRATION", "NA-PROD-INA-K8S", "NA-PROD-INA-DB"]
    region: "NA"
    notes: "Multi-zone: CMP-27 + CMP-31/CMP-32 Kafka clusters live in INF-15; CMP-33 in INF-17. (See input/systems-registry.md.)"

  - id: "dc-cn-primary"
    aliases: ["CN Primary DC", "主DC"]
    location: { city: "City A", province: "Province A", country: "CN" }
    model: "two-tier"
    zones: ["DMZ", "Intranet"]
    region: "APAC-CN"
    notes: "Hosts CMP-44 and CMP-45; CMP-29 Kafka. (See input/systems-registry.md.)"

  - id: "dc-cn-secondary"
    aliases: ["CN Secondary DC", "备DC"]
    location: { city: "City B", province: "Province B", country: "CN" }
    model: "two-tier"
    zones: ["DMZ", "Intranet"]
    region: "APAC-CN"
    notes: "Hosts CMP-38 through CMP-43; CMP-30 Kafka. (See input/systems-registry.md.)"

  - id: "azure-cn-north"
    aliases: ["Azure CN North"]
    location: { city: "City E", country: "CN" }
    model: "saas"
    zones: ["EDW"]
    region: "APAC-CN"
    notes: "CMP-53 data source (data stays in-country). (See input/systems-registry.md.)"

platforms:
  api_gateway: "APIM"
  message_bus: "Kafka"
  k8s_platform: "Internal K8s Platform"
  integration_platforms:
    - "APIM"
    - "DMZ-APIM"
    - "APIH"
    - "Kafka"
  auth_internal: "ADFS"
  auth_external: "Enterprise ID"
  authz_platform: "AuthZ Platform"
