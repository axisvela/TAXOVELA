arch:
  id: "OSP-001-TechDiagram-V1.0"
  name: "Supply-Chain Order Platform (OSP) - Active-Active CN and NA Technical Architecture"
  platform: "hybrid_cloud"
  version: "V1.0"
  author: "Architecture Team"
  owner_team: "Supply Chain IT"
  last_modified: "2026-09-14"

  deployment:
    - id: "dc-cn-primary"
      type: "private_dc"
      role: "production"
      location: "City A, Province A [CN]"
      owner: "InfraSec"
      network_zones:
        - id: "cn-intranet"
          type: "intranet"
          name: "Intranet"
          components:
            - {id: "SYS-01", name: "SYS-01 | F5", type: "LB", shape: "hexagon", language: "N/A", framework: "F5", runtime: "Network appliance", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN ingress load balancer"}
            - {id: "SYS-02", name: "SYS-02 | WAF", type: "LB", shape: "hexagon", language: "N/A", framework: "Enterprise WAF", runtime: "Security appliance", sensitivity: "Company Confidential", owner_type: "org_it", status: "in_plan", notes: "Optional CN WAF; enable after security-owner decision"}
            - {id: "SYS-03", name: "SYS-03 | Edge router", type: "NW", language: "N/A", framework: "Edge router", runtime: "Network platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN edge routing boundary"}
            - {id: "SYS-04", name: "SYS-04 | scop-cn-web", type: "FE", language: "N/A", framework: "Nginx", runtime: "Private DC web tier", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN employee web tier"}

        - id: "cn-app-zone"
          type: "app_zone"
          name: "App Zone"
          components:
            - {id: "SYS-05", name: "SYS-05 | Spring Cloud Gateway", type: "IP", shape: "parallelogram", language: "Java", framework: "Spring Cloud Gateway", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN application gateway"}
            - {id: "SYS-06", name: "SYS-06 | Order Creation", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-07", name: "SYS-07 | Order Change", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-08", name: "SYS-08 | Data Distribution", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-09", name: "SYS-09 | Master Data", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-10", name: "SYS-10 | Order Inquiry", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-11", name: "SYS-11 | Basic Operation", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-12", name: "SYS-12 | Logging", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-13", name: "SYS-13 | etc.", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-14", name: "SYS-14 | APIM", type: "IP", shape: "parallelogram", language: "N/A", framework: "APIM", runtime: "Integration platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "unchanged", notes: "CN API management boundary"}
            - {id: "SYS-15", name: "SYS-15 | WSO2", type: "IP", shape: "parallelogram", language: "N/A", framework: "WSO2 API Gateway", runtime: "Integration platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "unchanged", notes: "CN API gateway boundary"}
            - {id: "SYS-16", name: "SYS-16 | APIH", type: "IP", shape: "parallelogram", language: "N/A", framework: "APIH", runtime: "Integration platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "unchanged", notes: "CN API mediation boundary"}
            - {id: "SYS-17", name: "SYS-17 | Kafka", type: "MQ", shape: "message_queue", language: "N/A", framework: "Kafka", runtime: "Messaging platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN event and CDC publication bus"}
            - {id: "SYS-18", name: "SYS-18 | RabbitMQ", type: "MQ", shape: "message_queue", language: "N/A", framework: "RabbitMQ", runtime: "Messaging platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN CDC staging bus"}
            - {id: "SYS-19", name: "SYS-19 | Debezium", type: "IP", shape: "parallelogram", language: "Java", framework: "Debezium", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN CDC connector; no direct cross-region database replication"}
            - {id: "SYS-20", name: "SYS-20 | ECC-CN", type: "API", language: "N/A", framework: "SAP ECC Function and SLT", runtime: "Existing ERP platform", sensitivity: "Company Confidential", owner: "third_party", owner_type: "third_party", status: "unchanged"}
            - {id: "SYS-21", name: "SYS-21 | S4-CN", type: "API", language: "N/A", framework: "SAP S/4 Function and SLT", runtime: "Existing ERP platform", sensitivity: "Company Confidential", owner: "third_party", owner_type: "third_party", status: "unchanged"}
            - {id: "SYS-50", name: "SYS-50 | eComm-order-platform", type: "BE", language: "N/A", framework: "Existing application", runtime: "CN private platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}
            - {id: "SYS-51", name: "SYS-51 | SOS(sales order service)-PRC", type: "BE", language: "N/A", framework: "Existing application", runtime: "CN private platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}
            - {id: "SYS-52", name: "SYS-52 | CFOS(customer order fullfillment service)-PRC", type: "BE", language: "N/A", framework: "Existing application", runtime: "CN private platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}
            - {id: "SYS-53", name: "SYS-53 | CFOS(customer order fullfillment service)-AP", type: "BE", language: "N/A", framework: "Existing application", runtime: "CN private platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}
            - {id: "SYS-54", name: "SYS-54 | SSCS(Service supply chain service)-AP", type: "BE", language: "N/A", framework: "Existing application", runtime: "CN private platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}

        - id: "cn-db-zone"
          type: "db_zone"
          name: "DB Zone"
          components:
            - {id: "SYS-22", name: "SYS-22 | Elasticsearch HA", type: "DB", shape: "cylinder", language: "N/A", framework: "Elasticsearch HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "Encrypted search index"}
            - {id: "SYS-23", name: "SYS-23 | Redis HA", type: "DB", shape: "cylinder", language: "N/A", framework: "Redis HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "Encrypted cache persistence"}
            - {id: "SYS-24", name: "SYS-24 | MySQL HA", type: "DB", shape: "cylinder", language: "N/A", framework: "MySQL HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "CN-only relational group; AES-256 at rest"}
            - {id: "SYS-25", name: "SYS-25 | PostgreSQL HA", type: "DB", shape: "cylinder", language: "N/A", framework: "PostgreSQL HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "AES-256 at rest"}
            - {id: "SYS-26", name: "SYS-26 | SQLServer HA", type: "DB", shape: "cylinder", language: "N/A", framework: "SQL Server HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "TDE AES-256 at rest"}

    - id: "dc-us"
      type: "private_dc"
      role: "production"
      location: "City C, State X [US]"
      owner: "InfraSec"
      network_zones:
        - id: "na-prod-ina-earth"
          type: "intranet"
          name: "NA-PROD-INA-EARTH"
          components:
            - {id: "SYS-28", name: "SYS-28 | F5", type: "LB", shape: "hexagon", language: "N/A", framework: "F5", runtime: "Network appliance", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "NA ingress load balancer"}
            - {id: "SYS-29", name: "SYS-29 | WAF", type: "LB", shape: "hexagon", language: "N/A", framework: "Enterprise WAF", runtime: "Security appliance", sensitivity: "Company Confidential", owner_type: "org_it", status: "in_plan", notes: "Optional NA WAF; enable after security-owner decision"}
            - {id: "SYS-30", name: "SYS-30 | Edge router", type: "NW", language: "N/A", framework: "Edge router", runtime: "Network platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "NA edge routing boundary"}

        - id: "na-prod-ina-k8s"
          type: "app_zone"
          name: "NA-PROD-INA-K8S"
          components:
            - {id: "SYS-31", name: "SYS-31 | osp-na-web", type: "FE", language: "N/A", framework: "Nginx", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "NA employee web tier"}
            - {id: "SYS-32", name: "SYS-32 | Spring Cloud Gateway", type: "IP", shape: "parallelogram", language: "Java", framework: "Spring Cloud Gateway", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "NA application gateway"}
            - {id: "SYS-33", name: "SYS-33 | Order Creation", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-34", name: "SYS-34 | Order Change", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-35", name: "SYS-35 | Data Distribution", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-36", name: "SYS-36 | Master Data", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-37", name: "SYS-37 | Order Inquiry", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-38", name: "SYS-38 | Basic Operation", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-39", name: "SYS-39 | Logging", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-40", name: "SYS-40 | etc.", type: "BE", language: "Java", framework: "Spring", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed"}
            - {id: "SYS-58", name: "SYS-58 | ERPS（ERP service）", type: "BE", language: "N/A", framework: "Existing application", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}
            - {id: "SYS-59", name: "SYS-59 | LGS(logistics gateway service)-NA", type: "BE", language: "N/A", framework: "Existing application", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}
            - {id: "SYS-60", name: "SYS-60 | IBS(Installbase service)", type: "BE", language: "N/A", framework: "Existing application", runtime: "Internal K8s Platform", sensitivity: "Company Confidential", owner_type: "biz_owned", status: "unchanged"}

        - id: "na-prod-ina-integration"
          type: "app_zone"
          name: "NA-PROD-INA-INTEGRATION"
          components:
            - {id: "SYS-41", name: "SYS-41 | APIH", type: "IP", shape: "parallelogram", language: "N/A", framework: "APIH", runtime: "Integration platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "unchanged", notes: "Sole NA cross-application API mediator"}
            - {id: "SYS-42", name: "SYS-42 | Kafka", type: "MQ", shape: "message_queue", language: "N/A", framework: "Kafka", runtime: "Messaging platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "Sole NA cross-application event mediator"}

        - id: "na-prod-ina-sap"
          type: "app_zone"
          name: "NA-PROD-INA-SAP"
          components:
            - {id: "SYS-45", name: "SYS-45 | S4-NA", type: "API", language: "N/A", framework: "SAP S/4 Function and SLT", runtime: "Existing ERP platform", sensitivity: "Company Confidential", owner: "third_party", owner_type: "third_party", status: "unchanged"}

        - id: "na-prod-ina-server"
          type: "app_zone"
          name: "NA-PROD-INA-SERVER"
          components:
            - {id: "SYS-43", name: "SYS-43 | RabbitMQ", type: "MQ", shape: "message_queue", language: "N/A", framework: "RabbitMQ", runtime: "Messaging platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "NA CDC staging bus"}
            - {id: "SYS-44", name: "SYS-44 | Debezium", type: "IP", shape: "parallelogram", language: "Java", framework: "Debezium", runtime: "Server platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "NA CDC connector; no direct cross-region database replication"}

        - id: "na-prod-ina-db"
          type: "db_zone"
          name: "NA-PROD-INA-DB"
          components:
            - {id: "SYS-46", name: "SYS-46 | Elasticsearch HA", type: "DB", shape: "cylinder", language: "N/A", framework: "Elasticsearch HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "Encrypted search index"}
            - {id: "SYS-47", name: "SYS-47 | Redis HA", type: "DB", shape: "cylinder", language: "N/A", framework: "Redis HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "Encrypted cache persistence"}
            - {id: "SYS-48", name: "SYS-48 | PostgreSQL HA", type: "DB", shape: "cylinder", language: "N/A", framework: "PostgreSQL HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "AES-256 at rest"}
            - {id: "SYS-49", name: "SYS-49 | SQLServer HA", type: "DB", shape: "cylinder", language: "N/A", framework: "SQL Server HA", runtime: "HA data platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "changed", notes: "TDE AES-256 at rest"}

    - id: "dc-us-identity"
      type: "private_dc"
      role: "production"
      location: "City C, State X [US]"
      owner: "InfraSec"
      network_zones:
        - id: "identity-app-zone"
          type: "app_zone"
          name: "App Zone"
          components:
            - {id: "SYS-27", name: "SYS-27 | ADFS", type: "SEC", shape: "circle", language: "N/A", framework: "ADFS", runtime: "Existing identity platform", sensitivity: "Company Confidential", owner_type: "org_it", status: "unchanged", notes: "Employee SSO with MFA policy enforcement"}

    - id: "aws-us"
      type: "aws_vpc"
      role: "production"
      location: "AWS US East, N. Virginia [US]"
      owner: "Third Party"
      subnets:
        - id: "aws-us-private-app"
          type: "private"
          name: "Private subnet (APP)"
          components:
            - {id: "SYS-55", name: "SYS-55 | SOS(sales order service)-ROW", type: "BE", language: "N/A", framework: "Existing application", runtime: "AWS private application subnet", sensitivity: "Company Confidential", owner: "third_party", owner_type: "third_party", status: "unchanged", notes: "AWS US event consumer"}

    - id: "azure-us"
      type: "azure_vnet"
      role: "production"
      location: "Azure US [US]"
      owner: "Third Party"
      subnets:
        - id: "azure-us-app-zone"
          type: "spoke"
          name: "APP Zone"
          components:
            - {id: "SYS-56", name: "SYS-56 | edge-cache", type: "BE", language: "N/A", framework: "Existing Azure application", runtime: "Azure application platform", sensitivity: "Company Confidential", owner: "third_party", owner_type: "third_party", status: "unchanged"}
            - {id: "SYS-57", name: "SYS-57 | D365", type: "BE", shape: "cloud_rect", language: "N/A", framework: "Dynamics 365", runtime: "Microsoft SaaS", sensitivity: "Company Confidential", owner: "third_party", owner_type: "third_party", status: "unchanged"}

  interactions:
    # Employee ingress and SSO; optional WAFs remain explicitly visible in each symmetric path.
    - {from: "SYS-01", to: "SYS-02", protocol: "HTTPS", auth: "Mutual TLS", encryption: "TLS 1.3", notes: "CN optional WAF inspection"}
    - {from: "SYS-02", to: "SYS-03", protocol: "HTTPS", auth: "Mutual TLS", encryption: "TLS 1.3"}
    - {from: "SYS-03", to: "SYS-04", protocol: "HTTPS", auth: "Mutual TLS", encryption: "TLS 1.3"}
    - {from: "SYS-04", to: "SYS-27", protocol: "HTTPS/SAML 2.0", auth: "SAML 2.0", encryption: "TLS 1.3", notes: "CN employee SSO"}
    - {from: "SYS-04", to: "SYS-05", protocol: "HTTPS", auth: "SAML bearer session token", encryption: "TLS 1.3"}
    - {from: "SYS-28", to: "SYS-29", protocol: "HTTPS", auth: "Mutual TLS", encryption: "TLS 1.3", notes: "NA optional WAF inspection"}
    - {from: "SYS-29", to: "SYS-30", protocol: "HTTPS", auth: "Mutual TLS", encryption: "TLS 1.3"}
    - {from: "SYS-30", to: "SYS-31", protocol: "HTTPS", auth: "Mutual TLS", encryption: "TLS 1.3"}
    - {from: "SYS-31", to: "SYS-27", protocol: "HTTPS/SAML 2.0", auth: "SAML 2.0", encryption: "TLS 1.3", notes: "NA employee SSO"}
    - {from: "SYS-31", to: "SYS-32", protocol: "HTTPS", auth: "SAML bearer session token", encryption: "TLS 1.3"}

    # Regional application-gateway fan-out.
    - {from: "SYS-05", to: "SYS-06", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-05", to: "SYS-07", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-05", to: "SYS-08", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-05", to: "SYS-09", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-05", to: "SYS-10", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-05", to: "SYS-11", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-05", to: "SYS-12", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-05", to: "SYS-13", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-32", to: "SYS-33", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-32", to: "SYS-34", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-32", to: "SYS-35", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-32", to: "SYS-36", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-32", to: "SYS-37", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-32", to: "SYS-38", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-32", to: "SYS-39", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-32", to: "SYS-40", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}

    # CN cross-application mediation and regional events.
    - {from: "SYS-06", to: "SYS-16", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-07", to: "SYS-16", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-08", to: "SYS-14", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-09", to: "SYS-15", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-10", to: "SYS-16", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-11", to: "SYS-15", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-12", to: "SYS-14", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-13", to: "SYS-16", protocol: "HTTPS", auth: "OAuth 2.0 Client Credentials", encryption: "TLS 1.3"}
    - {from: "SYS-06", to: "SYS-17", protocol: "Kafka", auth: "SASL/SCRAM-SHA-512", encryption: "TLS 1.3"}
    - {from: "SYS-07", to: "SYS-17", protocol: "Kafka", auth: "SASL/SCRAM-SHA-512", encryption: "TLS 1.3"}
    - {from: "SYS-08", to: "SYS-17", protocol: "Kafka", auth: "SASL/SCRAM-SHA-512", encryption: "TLS 1.3"}
    - {from: "SYS-09", to: "SYS-17", protocol: "Kafka", auth: "SASL/SCRAM-SHA-512", encryption: "TLS 1.3"}
