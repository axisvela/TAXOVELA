name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # matplotlib is optional at runtime, but installing it here makes the
        # PNG renderer and the draw.io/PNG shape-parity test actually run
        # instead of skipping.
        run: pip install --quiet pyyaml pytest matplotlib

      - name: Unit tests (workspace)
        run: python -m pytest tests -q

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      # The schema compatibility check compares against the base revision, so
      # the clone cannot be shallow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install check dependencies
        run: pip install --quiet pyyaml

      - name: Distribution health check
        run: python scripts/check_repo.py

      - name: Verify Codex skill mirror is current
        run: python scripts/sync_agents_skills.py --check

      - name: Verify Claude plugin skills mirror is current
        run: python scripts/sync_plugin.py --check

      - name: Validate standards, schemas, and config YAML
        run: python tools/yaml_validate.py config.yaml standards/*.yaml schemas/*.json

      # Contracts are versioned by identity: a breaking change must ship as a
      # new schema id, not mutate one consumers pinned.
      - name: Verify schema compatibility against the base revision
        run: |
          baseline="${{ github.event.pull_request.base.sha }}"
          if [ -z "$baseline" ]; then baseline="HEAD^"; fi
          if git rev-parse --verify --quiet "${baseline}^{commit}" >/dev/null; then
            python -m archharness schema-check --baseline "$baseline"
          else
            echo "baseline ${baseline} is unavailable in this clone; skipping"
          fi

      # The reference examples carry recorded gate decisions; publish them with
      # the build so a reviewer can see the evidence the gate acted on.
      # docs/ci-pipeline.md shows the same pattern for a project.
      - name: Archive the recorded gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-evidence
          path: |
            examples/*/output/validation/*.json
            examples/*/output/validation/*.md
          retention-days: 30

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --quiet build

      - name: Clean-wheel smoke test
        run: python scripts/smoke_wheel.py
